}

$("fila").addEventListener("click", e => {
  const b = e.target.closest(".fila-item");
  if (b) { selecionar(b.dataset.d, b.dataset.t); trocarAba("pane-recall"); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregarFila(); });

/* ---------------------------------------------------- rascunho do resumo */

/* O que está no editor é salvo sozinho, por tópico, e volta quando o tópico
   é aberto de novo. Vale até a análise: depois dela o texto fica guardado na
   tentativa (dá para reler no histórico) e o rascunho some — a próxima
   revisão começa de uma página em branco, que é o exercício.
   `chave` é o tópico dono do conteúdo que está no editor agora. */
const rasc = { chave: null, disc: null, topic: null, id: 0, sujo: false, carga: 0,
               fila: Promise.resolve() };

function situacaoRasc(txt, cls = "") {
  const el = $("rasc-status");
  el.textContent = txt; el.className = "situacao parada " + cls;
}

function marcarRascunho() {
  if (!rasc.topic || state.refazer) return;      // o texto do "refazer" é descartável
  rasc.sujo = true;
  clearTimeout(rasc.id);
  rasc.id = setTimeout(salvarRascunho, 1000);
  situacaoRasc("salvando…");
}

/* Lê o editor na hora, antes de qualquer await: quem chama pode trocar o
   conteúdo logo em seguida. */
function salvarRascunho(saindo = false) {
  clearTimeout(rasc.id);
  if (!rasc.sujo || !rasc.topic || state.refazer) return;
  rasc.sujo = false;
  const texto = quill.getText().replace(/\n+$/, ""), chave = rasc.chave;
  const corpo = JSON.stringify({ discipline: rasc.disc, topic: rasc.topic, text: texto,
                                 delta: texto.trim() ? quill.getContents() : null });
  rasc.fila = rasc.fila.then(async () => {
    let ok = false;
    try {
      ok = (await fetch("/draft", { method: "POST", headers: { "Content-Type": "application/json" },
        body: corpo, keepalive: saindo === true && corpo.length < 60000 })).ok;
    } catch (e) {}
    if (chave !== rasc.chave) return;
    if (!ok) { rasc.sujo = true; situacaoRasc("rascunho não salvo", "err"); }
    else if (!rasc.sujo) situacaoRasc(texto.trim() ? "salvo" : "");
  });
}

async function abrirRascunho(disc, topic) {
  const chave = disc && topic ? disc + "\n" + topic : null;
  if (chave === rasc.chave) return;
  salvarRascunho();                               // o do tópico que está saindo
  Object.assign(rasc, { chave, disc, topic, sujo: false });
  const carga = ++rasc.carga;
  quill.setContents([], "api");
  situacaoRasc("");
  if (!chave) return quill.enable(true);
  // travado enquanto carrega: o que fosse digitado agora seria apagado pelo
  // rascunho que está chegando
  quill.enable(false);
  let d = null;
  try {
    await rasc.fila;
    const r = await fetch(`/draft?discipline=${encodeURIComponent(disc)}&topic=${encodeURIComponent(topic)}`);
    if (r.ok) d = await r.json();
  } catch (e) {}
  if (carga !== rasc.carga) return;               // já trocou de tópico de novo
  if (d && d.delta && Array.isArray(d.delta.ops)) quill.setContents(d.delta, "api");
  else if (d && d.text) quill.setText(d.text, "api");
  if (d && d.text) situacaoRasc("salvo");
  quill.enable(true);
}

function selecionar(disc, topic, recarregar = true) {
  // antes de trocar: os campos da teoria vão ser sobrescritos logo abaixo
  if (recarregar) salvarTeoria();
  state.disc = disc; state.topic = topic;
  sairDoRefazer();
  abrirRascunho(disc, topic);
  document.querySelectorAll("#tree .topic").forEach(el =>
    el.classList.toggle("active",
      el.dataset.topic === topic && el.closest(".disc").dataset.disc === disc));
  $("crumb").innerHTML = `<b>${esc(disc)}</b> / ${esc(topic)}`;
  voltarAoEditor();
  // o roteiro e os checks são de um tópico só; trocar de tópico zera os dois
  state.roteiro = null; state.marcados.clear();
  vazio();
  cabecalho(abaAtiva());
  if (recarregar && $("pane-theory").classList.contains("active")) carregarTeoria();
}

$("tree").addEventListener("click", e => {
  const del = e.target.closest(".del");
  if (del) {
    const disc = del.closest(".disc").dataset.disc;
    if (del.dataset.exp) return abrirExportar(disc);
    del.dataset.delTopic !== undefined
      ? apagarTopico(disc, del.dataset.delTopic)
      : apagarDisciplina(disc);
    return;
  }
  const head = e.target.closest(".disc-head");
  if (head) {
    const bloco = head.closest(".disc"), nome = bloco.dataset.disc;
    bloco.classList.toggle("closed");
    bloco.classList.contains("closed") ? state.fechadas.add(nome) : state.fechadas.delete(nome);
    return;
  }
  const t = e.target.closest(".topic");
  if (t) selecionar(t.closest(".disc").dataset.disc, t.dataset.topic);
});

/* -------------------------------------------------------------- teoria */

async function textoDaTeoria(disc, topic) {
  try {
    const q = `?discipline=${encodeURIComponent(disc)}&topic=${encodeURIComponent(topic)}`;
    const r = await fetch("/theory" + q);
    return r.ok ? (await r.json()).content || "" : "";
  } catch (e) { return ""; }
}

async function carregarTeoria() {
  if (!state.topic) return;
  const disc = state.disc, topic = state.topic, ta = $("f-content");
  const carga = ++auto.carga;
  // quem chama já salvou o que estava aberto; daqui em diante nada pendente
  // pode ser gravado por cima do tópico que está chegando
  clearTimeout(auto.id); auto.sujo = false;
  $("f-disc").value = disc; $("f-topic").value = topic;
  // travado enquanto carrega: digitar aqui salvaria "carregando..." como teoria
  ta.value = "carregando..."; ta.readOnly = true;
  situacao("");
  let conteudo = "", ok = false;
  try {
    const q = `?discipline=${encodeURIComponent(disc)}&topic=${encodeURIComponent(topic)}`;
    const r = await fetch("/theory" + q);
    ok = r.ok;
    if (ok) conteudo = (await r.json()).content || "";
  } catch (e) {}
  // resposta atrasada, de uma carga que já foi substituída por outra ou por
  // um tópico novo em branco: descarta, senão o texto de um tópico iria parar
  // (e ser salvo) em outro
  if (carga !== auto.carga) return;
  ta.value = conteudo; ta.readOnly = false;
  contarTeoria(); carregarImagens();
  situacao(ok ? "salvo" : "");
}

function novoTopico() {
  salvarTeoria();
  auto.sujo = false; situacao("");
  trocarAba("pane-theory");
  auto.carga++;                       // cancela uma carga de teoria em andamento
  $("f-content").readOnly = false;
  $("f-disc").value = state.disc || ""; $("f-topic").value = ""; $("f-content").value = "";
  $("f-imgs").innerHTML = "";
  contarTeoria(); $("f-topic").focus();
}

/* Apagar é irreversível e leva o histórico junto, então confirma antes
   dizendo exatamente o que some. */
async function apagar(url, aviso, ok) {
  if (!confirm(aviso)) return;
  // espera a fila de salvamento esvaziar: um salvamento que chegasse depois
  // do DELETE recriaria o tópico recém-apagado
  salvarTeoria(); await auto.fila;
  salvarRascunho(); await rasc.fila;
  const r = await fetch(url, { method: "DELETE" });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return toast(d.detail || `Falha ao apagar (HTTP ${r.status}).`);
  state.disc = null; state.topic = null;
  sairDoRefazer(); rasc.sujo = false; abrirRascunho(null, null);
  $("crumb").innerHTML = ""; voltarAoEditor(); vazio();
  await carregarArvore();
  cabecalho(abaAtiva());
  if (abaAtiva() === "pane-stats") carregarStats();
  toast(ok(d));
}

function apagarTopico(disc, topic) {
  return apagar(
    `/theory?discipline=${encodeURIComponent(disc)}&topic=${encodeURIComponent(topic)}`,
    `Apagar o tópico "${topic}" de ${disc}?\n\nIsso remove a teoria e todo o histórico de desempenho dele. Não dá para desfazer.`,
    d => `"${topic}" apagado (${d.attempts_removed || 0} tentativa(s) removidas).`
  );
}

function apagarDisciplina(disc) {
  const n = (state.disciplinas.find(x => x.name === disc) || {}).topics || [];
  return apagar(
    `/discipline?discipline=${encodeURIComponent(disc)}`,
    `Apagar a disciplina "${disc}" inteira?\n\nIsso remove ${n.length} tópico(s) e todo o histórico deles. Não dá para desfazer.`,
    d => `"${disc}" apagada (${d.topics_removed || 0} tópico(s), ${d.attempts_removed || 0} tentativa(s)).`
  );
}

/* ------------------------------------------------ salvamento automático */

/* Salva sozinho pouco depois de você parar de digitar; digitando sem parar,
   salva mesmo assim a cada TETO. Trocar de tópico, de aba ou fechar a página
   salva na hora. Os envios vão em fila, um de cada vez: dois ao mesmo tempo
   poderiam chegar fora de ordem e o mais velho ficaria por cima. */
const ESPERA = 1200, TETO = 8000;
const auto = { id: 0, sujo: false, desde: 0, versao: 0, carga: 0, fila: Promise.resolve() };

function situacao(txt, cls = "") {
  const el = $("save-status");
  el.textContent = txt; el.className = "situacao " + cls;
}

const existeTopico = (disc, topic) =>
  state.disciplinas.some(d => d.name === disc && d.topics.includes(topic));

function marcarSujo() {
  if ($("f-content").readOnly) return;
  if (!auto.sujo) { auto.sujo = true; auto.desde = Date.now(); }
  clearTimeout(auto.id);
  auto.id = setTimeout(salvarTeoria, Math.max(0, Math.min(ESPERA, TETO - (Date.now() - auto.desde))));
  if (podeSalvar()) situacao("salvando…");
}

/* Diz na tela por que não dá para salvar ainda; true quando dá. */
function podeSalvar() {
  const disc = $("f-disc").value.trim(), topic = $("f-topic").value.trim();
  if (!$("f-content").value.trim()) {
    // teoria vazia não é gravada; só vale avisar se havia uma antes
    situacao(existeTopico(disc, topic) ? "texto vazio: não salvo" : "", "warn");
    return false;
  }
  if (!disc || !topic) { situacao("falta disciplina ou tópico", "warn"); return false; }
  return true;
}

/* Grava o que está nos três campos, se houver mudança pendente. Lê os campos
   na hora, antes de qualquer await: quem chama (troca de tópico, de aba) pode
   sobrescrevê-los em seguida. `saindo` é o salvamento de quando a página
   fecha, que precisa sobreviver a ela. */
function salvarTeoria(saindo = false) {
  clearTimeout(auto.id);
  if (!auto.sujo || !podeSalvar()) return;
  const discipline = $("f-disc").value.trim(), topic = $("f-topic").value.trim();
  const corpo = JSON.stringify({ discipline, topic, content: $("f-content").value });
  auto.sujo = false;
  const versao = ++auto.versao;
  situacao("salvando…");

  auto.fila = auto.fila.then(async () => {
    let ok = false;
    try {
      ok = (await fetch("/theory", { method: "POST", headers: { "Content-Type": "application/json" },
        // keepalive deixa o envio terminar com a página fechada, mas o
        // navegador só aceita corpos pequenos nesse modo
        body: corpo, keepalive: saindo === true && corpo.length < 60000 })).ok;
    } catch (e) {}
    const aberto = $("f-disc").value.trim() === discipline && $("f-topic").value.trim() === topic;
    if (!ok) {
      // volta a ficar pendente: a próxima tecla, ou um clique aqui, tenta de novo
      if (aberto && versao === auto.versao) { auto.sujo = true; situacao("falha ao salvar", "err"); }
      return;
    }
    // tópico novo (ou salvo com outro nome) passa a ser o tópico aberto, sem
    // recarregar o texto: isso apagaria o que foi digitado nesse meio-tempo.
    // O estado muda antes de a árvore recarregar porque, sem tópico aberto,
    // ela abriria o primeiro da lista e recarregaria o texto por conta própria
    const mudou = aberto && (state.disc !== discipline || state.topic !== topic);
    if (mudou) { state.disc = discipline; state.topic = topic; }
    if (!existeTopico(discipline, topic)) await carregarArvore();
    if (mudou) selecionar(discipline, topic, false);
    if (aberto && versao === auto.versao && !auto.sujo) situacao("salvo");
  });
}

function salvarAgora() {
  auto.sujo = true;
  salvarTeoria();
}

/* ------------------------------------------------------------- análise */

function contarPalavras() {
  const t = quill.getText().trim();
  const p = t ? t.split(/\s+/).length : 0;
  $("counter").textContent = `${p.toLocaleString("pt-BR")} palavra${p === 1 ? "" : "s"}`;
}

function voltarAoEditor() {
  $("edit-wrap").hidden = false; $("review-wrap").hidden = true;
  $("acao-editar").hidden = false; $("acao-revisao").hidden = true;
  contarPalavras();                 // na revisão o contador mostrava os trechos marcados
}

async function analisar() {
  if (state.carregando) return;
  if (!state.topic) return toast("Selecione um tópico primeiro.");
  const texto = quill.getText().replace(/\n+$/, "");
  if (!texto.trim()) return toast("Escreva alguma coisa antes de analisar.");

  state.carregando = true;
  const btn = $("btn-analisar");
  btn.disabled = true; btn.textContent = "Analisando...";
  $("painel").innerHTML = `<div class="loading"><i></i></div>
    <div class="empty">Analisando…</div>`;
  // o texto fica parado enquanto o modelo lê; e o rascunho vai antes da
  // análise: se ela falhar, o que foi escrito continua salvo
  quill.enable(false);
  salvarRascunho(); await rasc.fila;
  const foco = state.refazer ? state.refazer.map(x => x.nome) : [];

  try {
    const r = await fetch("/check-knowledge", { method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ discipline: state.disc, topic: state.topic,
                             user_text: texto, mode: state.modo, focus: foco }) });
    const bruto = await r.text();
    if (!r.ok) throw new Error(`HTTP ${r.status}\n${bruto.slice(0, 400)}`);
    let d;
    try { d = JSON.parse(bruto); }
    catch { throw new Error("A resposta não era JSON válido:\n" + bruto.slice(0, 400)); }
    if (!d || typeof d.coverage_percentage !== "number")
      throw new Error("JSON sem os campos esperados:\n" + bruto.slice(0, 400));

    state.texto = texto;
    state.itens = d.detailed_analysis || [];
    state.revisados.clear();
    state.teoria = await textoDaTeoria(state.disc, state.topic);
    const marcadas = renderRevisao(texto, state.itens);
    renderPainel(d, marcadas);
    $("edit-wrap").hidden = true; $("review-wrap").hidden = false;
    $("acao-editar").hidden = true; $("acao-revisao").hidden = false;
    $("btn-refazer").hidden = !pontosErrados().length;
    if (!foco.length) {
      // o servidor guardou o texto na tentativa e apagou o rascunho
      clearTimeout(rasc.id); rasc.sujo = false; situacaoRasc("");
      carregarFila();
    }
    $("counter").textContent = marcadas
      ? `${marcadas} trecho${marcadas === 1 ? "" : "s"} marcado${marcadas === 1 ? "" : "s"}`
      : "nenhum trecho localizado no texto";
  } catch (e) {
    $("painel").innerHTML = `<div class="err-box"><b>A análise falhou</b>${esc(e.message)}

O agente está em modo verbose: o terminal do uvicorn mostra a resposta crua do modelo.</div>`;
  } finally {
    state.carregando = false; btn.disabled = false; btn.textContent = "Analisar";
    quill.enable(true);
  }
}

/* --------------------------------------------------- refazer o que errou */

/* Depois da análise: o editor esvazia e só os pontos que não saíram certos
   são pedidos de novo. A análise seguinte avalia apenas eles e não entra no
   histórico — reescrever logo depois de ler a correção não mede memória. */
const pontosErrados = () => state.itens
  .filter(i => i._k !== "ok" && String(i.concept || "").trim())
  .map(i => ({ nome: String(i.concept).trim(), k: i._k }));

function barraRefazer() {
  const on = !!state.refazer;
  $("modos").hidden = on; $("refazendo").hidden = !on;
  if (on) $("refazendo-n").textContent =
    `Refazendo ${state.refazer.length} ponto${state.refazer.length === 1 ? "" : "s"}`;
  quill.root.dataset.placeholder = on ? "Reescreva só os pontos ao lado." : "Escreva o que você lembra.";
}

function iniciarRefazer() {
  const pontos = pontosErrados();
  if (!pontos.length || state.carregando) return;
  state.refazer = pontos;
  quill.setContents([], "api");
  voltarAoEditor(); barraRefazer(); renderRefazer();
  quill.focus();
}

function sairDoRefazer() {
  if (!state.refazer) return;
  state.refazer = null;
  quill.setContents([], "api");
  voltarAoEditor(); barraRefazer(); vazio();
}

function renderRefazer() {
  $("painel").innerHTML = `<div class="label" style="margin-top:calc(-1 * var(--pad))">Refazer
      <span>${state.refazer.length}</span></div>
    ${state.refazer.map(x => `<div class="detail ${x.k}" style="cursor:default">
      <div class="top"><span class="concept">${esc(x.nome)}</span>
        <span class="chip ${x.k}">${ROTULO[x.k]}</span></div></div>`).join("")}`;
}

/* Quando o modelo não devolve "reference", procura na teoria a linha que fala
   do conceito. Um trecho aproximado ensina mais do que "Não mencionado". */
function trechoDaTeoria(conceito) {
  if (!state.teoria || !conceito) return "";
  const linhas = state.teoria.split(/\n+/).map(l => l.trim()).filter(l => l.length > 15);
  const alvo = normalizar(conceito).texto.trim();
  if (!alvo) return "";
  let achou = linhas.find(l => normalizar(l).texto.includes(alvo));
  if (!achou) {
    const palavras = alvo.split(" ").filter(p => p.length > 4).sort((a, b) => b.length - a.length);
    for (const p of palavras) {
      achou = linhas.find(l => normalizar(l).texto.includes(p));
      if (achou) break;
    }
  }
  return achou ? achou.slice(0, 500) : "";
}

/* Sem marcações há três causas diferentes, e culpar o modelo pelas três é
   mentira: conceito "não lembrado" não tem trecho por definição. */
function notaDeRodape(marcadas, itens, nadaBateu) {
  if (marcadas)
    return "";
  if (nadaBateu)
    return "Nada foi marcado no texto porque nenhum conceito da teoria apareceu nele. ";
  const comCitacao = itens.filter(i => i._k !== "none" && (i.evidence || "").trim()).length;
  if (comCitacao)
    return "Nenhum trecho pôde ser ancorado: o modelo devolveu citações que não existem literalmente no seu texto. ";
  return "O modelo não devolveu citações do seu texto, então não houve o que marcar. ";
}

function renderPainel(d, marcadas) {
  const pct = Math.max(0, Math.min(100, Number(d.coverage_percentage) || 0));
  const itens = state.itens, faltou = d.missing_concepts || [];
  const conta = k => itens.filter(i => i._k === k).length;

  // o que você já acertou não precisa da teoria ocupando espaço
  itens.forEach(it => {
    it._ref = it._k === "ok" ? ""
      : (it.reference || "").trim() || trechoDaTeoria(it.concept);
  });

  // zero conceitos batendo quase sempre significa tópico errado selecionado,
  // não desempenho ruim — vale avisar antes que a pessoa culpe o próprio estudo
  const nadaBateu = itens.length > 0 && itens.every(i => i._k === "none");

  // missing_concepts repete o que já está nos cards; só interessa o que o
  // modelo citou como ausente mas esqueceu de detalhar
  const vistos = new Set(itens.map(i => normalizar(i.concept || "").texto.trim()));
  const orfaos = faltou.filter(m => !vistos.has(normalizar(m).texto.trim()));

  const nota = notaDeRodape(marcadas, itens, nadaBateu);
  $("painel").innerHTML = `
    ${nadaBateu ? `<div class="aviso">Nenhum dos ${itens.length} conceito(s) da teoria de
      <b>${esc(state.topic)}</b> apareceu no seu texto.<br>
      Se não era esperado, confira se o tópico selecionado no menu à esquerda é o
      mesmo sobre o qual você escreveu.</div>` : ""}
    <div class="card score">
      <div class="big"><b>${pct.toFixed(0)}</b><span>${state.refazer ? "% dos pontos refeitos" : "% de cobertura"}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="tally">
        <div><i class="dot ok"></i>Lembrados <b>${conta("ok")}</b></div>
        <div><i class="dot warn"></i>Parciais <b>${conta("warn")}</b></div>
        <div><i class="dot err"></i>Incorretos <b>${conta("err")}</b></div>
        <div><i class="dot none"></i>Não lembrados <b>${conta("none")}</b></div>
      </div>
    </div>

    <div class="label">Conceitos
      <span><span class="progresso" id="progresso">${itens.length}</span>
      <button class="linkbtn" id="btn-limpar" hidden onclick="limparRevisados()">limpar</button></span></div>
    ${itens.map((it, idx) => `
      <div class="detail ${it._k}${it._marcado ? " linked" : ""}" data-idx="${idx}">
        <div class="top"><span class="tick"></span>
          <span class="concept">${esc(it.concept)}</span>
          <span class="chip ${it._k}">${ROTULO[it._k]}</span></div>
        <div class="why">${esc(it.explanation)}</div>
        ${it._marcado ? `<div class="quote"><span class="tag">você escreveu</span>“${esc((it.evidence || "").trim())}”</div>` : ""}
        ${it._semTrecho ? `<div class="quote" style="font-style:normal">trecho não localizado no texto</div>` : ""}
        ${it._ref ? `<div class="ref"><span class="tag">na teoria</span>${fmtInline(it._ref)}</div>` : ""}
      </div>`).join("")}

    ${orfaos.length ? `<div class="block">
      <div class="label">Citados como ausentes, sem análise</div>
      <div class="chips">${orfaos.map(m => `<span class="miss-chip">${esc(m)}</span>`).join("")}</div>
      </div>` : ""}

    ${nota ? `<div class="block empty">${nota}</div>` : ""}`;
  atualizarProgresso();
}

/* ------------------------------------------------------- revisão manual */

function alternarRevisado(idx) {
  const jaEstava = state.revisados.has(idx);
  jaEstava ? state.revisados.delete(idx) : state.revisados.add(idx);
  // pega o card e a marcação no texto de uma vez: ambos carregam o mesmo data-idx
  document.querySelectorAll('[data-idx="' + idx + '"]')
    .forEach(el => el.classList.toggle("done", !jaEstava));
  atualizarProgresso();
}

function limparRevisados() {
  state.revisados.clear();
  document.querySelectorAll(".done").forEach(el => el.classList.remove("done"));
  atualizarProgresso();
}

function atualizarProgresso() {
  const el = $("progresso");
  if (!el) return;
  const total = state.itens.length, n = state.revisados.size;
  el.textContent = n ? `${n}/${total} revisados` : total;
  el.classList.toggle("tudo", n > 0 && n === total);
  const limpar = $("btn-limpar");
  if (limpar) limpar.hidden = n === 0;
}

function vazio() {
  if (state.refazer) return renderRefazer();
  // no modo "com dicas" o painel direito é o roteiro, não um espaço em branco
  if (state.modo === "dicas") return state.roteiro ? renderRoteiro() : carregarRoteiro();
  $("painel").innerHTML = `<div class="empty">Sem análise.</div>`;
}

/* ------------------------------------------------------ modos de escrita */

/* Livre: nenhuma pista, o texto sai só da memória.
   Com dicas: o painel direito vira um checklist dos termos que a teoria cobre,
   para marcar conforme escreve. As dicas trazem só o NOME do termo — a
   definição continua sendo trabalho de quem está estudando. */

const NOTA_MODO = {
  livre: "Nenhuma pista: escreva tudo que lembrar do tópico.",
  dicas: "O painel da direita lista os termos a cobrir. Marque conforme escreve.",
};

function trocarModo(m, guardar = true) {
  state.modo = m === "dicas" ? "dicas" : "livre";
  document.querySelectorAll(".modo").forEach(b =>
    b.classList.toggle("active", b.dataset.modo === state.modo));
  $("modo-nota").textContent = NOTA_MODO[state.modo];
  if (guardar) { try { localStorage.setItem("ar-modo", state.modo); } catch (e) {} }
  // trocar de modo durante a revisão não pode apagar o resultado da análise
  if ($("review-wrap").hidden) {
    if (state.modo === "dicas") carregarRoteiro(); else vazio();
  }
}

async function carregarRoteiro() {
  if (!state.topic) return vazioSemTopico();
  state.roteiro = null;
  $("painel").innerHTML = `<div class="loading"><i></i></div>`;
  try {
    const r = await fetch(`/outline?discipline=${encodeURIComponent(state.disc)}`
                        + `&topic=${encodeURIComponent(state.topic)}`);
    state.roteiro = r.ok ? await r.json() : null;
  } catch (e) { state.roteiro = null; }
  renderRoteiro();
}

function vazioSemTopico() {
  $("painel").innerHTML = `<div class="empty">Nenhum tópico.</div>`;
}

async function gerarRoteiro() {
  if (!state.topic || state.carregando) return;
  // regerar troca a lista inteira, então as marcas feitas até aqui não valem mais
  if (state.marcados.size && !confirm(
      `Montar o roteiro de novo?\n\nIsso usa o modelo mais uma vez e desmarca os `
      + `${state.marcados.size} termo(s) que você já marcou.`)) return;
  state.carregando = true;
  $("painel").innerHTML = `<div class="loading"><i></i></div>
    <div class="empty">Gerando dicas…</div>`;
  try {
    const r = await fetch(`/outline?discipline=${encodeURIComponent(state.disc)}`
                        + `&topic=${encodeURIComponent(state.topic)}`, { method:"POST" });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
    state.roteiro = d;
    state.marcados.clear();
    renderRoteiro();
    toast("roteiro pronto");
  } catch (e) {
    $("painel").innerHTML = `<div class="err-box"><b>Não deu para montar o roteiro</b>${esc(e.message)}</div>
      <div style="margin-top:12px"><button class="btn btn-outline" onclick="gerarRoteiro()">Tentar de novo</button></div>`;
  } finally { state.carregando = false; }
}

function renderRoteiro() {
  if (!state.topic) return vazioSemTopico();
  const r = state.roteiro;

  if (!r || !r.blocks) {
    $("painel").innerHTML = `<div class="empty">Sem roteiro.</div>
      <div style="margin-top:12px"><button class="btn btn-primary" onclick="gerarRoteiro()">Gerar dicas</button></div>`;
    return;
  }

  const termos = r.blocks.flatMap(b => b.terms);
  const feitos = termos.filter(t => state.marcados.has(t)).length;

  // um roteiro em que quase nenhum termo aparece na teoria é sinal de que o
  // modelo traduziu em vez de copiar — o caso clássico é sair tudo em inglês
  const traduziu = (r.off || 0) > termos.length / 2;

  const aviso = r.stale
    ? `<div class="rt-aviso">A teoria mudou depois que este roteiro foi gerado,
       então ele pode estar incompleto.</div>`
    : traduziu
    ? `<div class="rt-aviso">${r.off} dos ${termos.length} termos não aparecem assim
       na teoria — o modelo provavelmente traduziu em vez de copiar. Vale regerar.</div>`
    : "";

  $("painel").innerHTML = `<div class="roteiro">
    <div class="rt-topo"><b>Roteiro</b>
      <span class="rt-prog">${feitos}/${termos.length} marcados</span>
      <button class="hbtn" onclick="gerarRoteiro()"
        title="Monta o roteiro de novo, com uma nova chamada ao modelo">regerar</button></div>
    ${aviso}
    ${r.blocks.map(b => `<div class="rt-bloco">
        <div class="t">${esc(b.title)}</div>
        <div class="rt-lista">${b.terms.map(t => {
          const on = state.marcados.has(t);
          return `<span class="termo${on ? " feito" : ""}" data-termo="${esc(t)}">
            <span class="bx">✓</span><span class="nm">${esc(t)}</span></span>`;
        }).join("")}</div>
      </div>`).join("")}
  </div>`;
}

$("painel").addEventListener("click", e => {
  const t = e.target.closest("[data-termo]");
  if (!t) return;
  const nome = t.dataset.termo;
  state.marcados.has(nome) ? state.marcados.delete(nome) : state.marcados.add(nome);
  renderRoteiro();
});

document.querySelectorAll(".modo").forEach(b =>
  b.addEventListener("click", () => trocarModo(b.dataset.modo)));

$("review").addEventListener("mouseover", e => {
  const m = e.target.closest(".mk"); if (m) focar(m.dataset.idx, true);
});
$("review").addEventListener("mouseout", e => {
  const m = e.target.closest(".mk"); if (m) focar(m.dataset.idx, false);
});
$("side").addEventListener("click", e => {
  if (e.target.closest(".linkbtn")) return;          // "limpar" tem handler próprio
  const c = e.target.closest(".detail");
  if (c && c.dataset.idx) alternarRevisado(c.dataset.idx);
});
$("side").addEventListener("mouseover", e => {
  const c = e.target.closest(".detail"); if (c && c.dataset.idx) focar(c.dataset.idx, true);
});
$("side").addEventListener("mouseout", e => {
  const c = e.target.closest(".detail"); if (c && c.dataset.idx) focar(c.dataset.idx, false);
});

/* --------------------------------------------------------- estatísticas */

async function carregarStats() {
  $("stats").innerHTML = `<div class="empty">Carregando...</div>`;
  const d = await (await fetch("/stats")).json();
  const discs = d.disciplines || [];
  if (!discs.length) { $("stats").innerHTML = `<div class="empty">Nenhuma disciplina.</div>`; return; }

  $("stats").innerHTML = `<table class="stats"><thead><tr>
      <th>Disciplina / tópico</th><th>Última vez</th><th>Revisão</th><th>Tentativas</th>
      <th>Média</th><th>Evolução</th>
    </tr></thead><tbody>
    ${discs.map(d => linhaDisciplina(d) + d.topics.map(t => linhaTopico(d.name, t)).join("")).join("")}
    </tbody></table>`;
}

const pc = v => v == null ? "—" : v.toFixed(0) + "%";

/* Há quanto tempo o tópico não é praticado. Compara DATAS de calendário, não
   períodos de 24h: praticado ontem à noite deve dizer "ontem", não "hoje". */
function diasDesde(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return null;
  const zero = x => { const c = new Date(x); c.setHours(0, 0, 0, 0); return c; };
  return Math.round((zero(new Date()) - zero(d)) / 86400000);
}

function quando(iso) {
  if (!iso) return `<span style="color:var(--dim)">nunca</span>`;
  const dias = diasDesde(iso);
  if (dias === null) return `<span style="color:var(--dim)">—</span>`;
  const d = new Date(iso);
  const txt = dias <= 0 ? "hoje" : dias === 1 ? "ontem" : `há ${dias} dias`;
  const cls = dias >= 14 ? "atraso-err" : dias >= 7 ? "atraso-warn" : "atraso-ok";
  return `<span class="${cls}" title="${esc(d.toLocaleString("pt-BR"))}">${txt}</span>`;
}

/* Quando o tópico volta, pela revisão espaçada. */
function revisao(t) {
  const n = t.days_left;
  if (n == null) return `<span style="color:var(--dim)">—</span>`;
  const dica = `intervalo atual: ${t.interval} dia${t.interval === 1 ? "" : "s"}`;
  if (n < 0) return `<span class="atraso-err" title="${dica}">atrasada ${-n} d</span>`;
  if (n === 0) return `<span class="atraso-warn" title="${dica}">hoje</span>`;
  return `<span title="${dica}">${n === 1 ? "amanhã" : `em ${n} d`}</span>`;
}

function linhaDisciplina(d) {
  const fechada = state.fechadas.has(d.name);
  // a data da disciplina é a do tópico mais recente, então ela pode parecer
  // em dia enquanto outros tópicos apodrecem; este contador denuncia isso
  const parados = d.topics.filter(t => {
    const n = diasDesde(t.last_at);
    return n !== null && n >= 7;
  }).length;
  // o selo acompanha a única coluna de percentual que sobrou: a média
  const badge = d.avg == null ? `<span class="badge none">sem dados</span>`
    : `<span class="badge ${faixa(d.avg)}">${d.avg.toFixed(0)}%</span>`;
  return `<tr class="d-row${fechada ? " closed" : ""}" data-disc="${esc(d.name)}">
    <td><span class="caret">▼</span><b>${esc(d.name)}</b>
      <span class="meta">${d.practiced}/${d.topics.length} praticados${parados
        ? ` · <span class="atraso-warn">${parados} parado${parados > 1 ? "s" : ""}</span>` : ""}</span></td>
    <td>${quando(d.last_at)}</td>
    <td>${(n => n ? `<span class="atraso-warn">${n} para hoje</span>` : "")(
      d.topics.filter(t => t.days_left != null && t.days_left <= 0).length)}</td>
    <td>${d.attempts}</td>
    <td>${badge}</td>
    <td>${d.attempts ? `<button class="hbtn" data-hd="${esc(d.name)}">histórico</button>` : ""}</td></tr>`;
}

function linhaTopico(disc, t) {
  const oculta = state.fechadas.has(disc) ? " hide" : "";
  const link = `<button class="tlink" data-d="${esc(disc)}" data-t="${esc(t.name)}">${esc(t.name)}</button>`;
  if (!t.attempts)
    return `<tr class="t-row never${oculta}" data-de="${esc(disc)}"><td>${link}</td>
      <td>${quando(null)}</td><td>—</td><td>0</td><td>—</td><td>nunca praticado</td></tr>`;

  // a variação é entre a primeira e a última tentativa; sem as colunas
  // "Primeira" e "Última" ela vive junto do sparkline, que é sobre o mesmo
  const delta = t.last - t.first;
  const seta = t.attempts > 1 && Math.abs(delta) >= 0.5
    ? `<span class="delta ${delta > 0 ? "up" : "down"}"
         title="${t.first.toFixed(0)}% na primeira tentativa, ${t.last.toFixed(0)}% na última"
       >${delta > 0 ? "▲" : "▼"}${Math.abs(delta).toFixed(0)}</span>` : "";
  const spark = t.trend.map(v => `<i class="${faixa(v)}" style="height:${Math.max(10, v)}%" title="${v}%"></i>`).join("");
  return `<tr class="t-row${oculta}" data-de="${esc(disc)}"><td>${link}</td>
    <td>${quando(t.last_at)}</td><td>${revisao(t)}</td><td>${t.attempts}</td>

    <td><span class="spark">${spark}</span>${seta}
      <button class="hbtn" data-hd="${esc(disc)}" data-ht="${esc(t.name)}">histórico</button></td></tr>`;
}

/* ------------------------------------------ marcação da teoria → HTML */

/* A teoria é texto puro e continua sendo: **negrito**, *itálico*, ==destaque==,
   `código` e $fórmula$ são marcação dentro dele. Estas regras espelham as de
   storage.sem_enfase(), que tira a ênfase antes de o texto ir para o modelo.
   Fórmula: "$" colado no conteúdo dos dois lados e sem dígito depois, para
   "R$ 10 e R$ 20" não virar matemática. Fórmula e código são trechos
   protegidos: um "*" dentro deles é conteúdo, não ênfase. */
const RE_FORMULA = /\$\$([\s\S]+?)\$\$|\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\d)|`([^`\n]+)`/g;

function tex(src, bloco) {
  // sem a biblioteca (offline) ou com LaTeX inválido, mostra o código cru
  if (!window.katex) return `<code>${esc(src)}</code>`;
  try { return katex.renderToString(src, { displayMode: bloco, throwOnError: false }); }
  catch (e) { return `<code>${esc(src)}</code>`; }
}

/* A marca precisa estar solta de letras e números por fora: "2**3 e 4**5" e
   "a==b e c==d" são código, não negrito nem destaque. */
function enfase(t) {          // recebe texto já escapado
  return t.replace(/(?<![\w*])\*\*(?=\S)(.+?)(?<=\S)\*\*(?![\w*])/g, "<strong>$1</strong>")
          .replace(/(?<![\w*])\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*(?![\w*])/g, "<em>$1</em>")
          .replace(/(?<![\w=])==(?=\S)(.+?)(?<=\S)==(?![\w=])/g, "<mark>$1</mark>");
}

/* Imagem ligada a um trecho: "[trecho](imagem:a.png)" — com mais de uma,
   "[trecho](imagem:a.png,b.png)". A imagem não aparece no texto: o trecho
   ganha um sublinhado e ela abre ao passar o mouse. Mesma regra de
   storage.LIGADA, que deixa só o trecho antes de o texto ir para o modelo.
   Só com matchAll e replace: é uma regex global, test() guardaria posição. */
const RE_LIG = /\[([^\[\]\n]+)\]\(\s*imagem:\s*([^()\n]+?)\s*\)/gi;
const nomesDaLista = lista => String(lista || "").split(",").map(x => x.trim()).filter(Boolean);

function fmtInline(s) {
  s = String(s ?? "");
  // a ligação sai da frente antes da ênfase e volta depois: assim
  // "**[termo](imagem:x.png)**" continua sendo negrito. Os três caracteres
  // são de uso privado, não aparecem em texto de verdade
  const listas = [];
  s = s.replace(RE_LIG, (tudo, dentro, lista) =>
    `${listas.push(lista) - 1}${dentro}`);
  let out = "", fim = 0;
  for (const m of s.matchAll(RE_FORMULA)) {
    out += enfase(esc(s.slice(fim, m.index)));
    out += m[1] != null ? tex(m[1].trim(), true)
         : m[2] != null ? tex(m[2], false) : `<code>${esc(m[3])}</code>`;
    fim = m.index + m[0].length;
  }
  out += enfase(esc(s.slice(fim)));
  return listas.length
    ? out.replace(/(\d+)/g, (t, k) => `<span class="lig" data-imgs="${esc(listas[k])}">`)
         .replace(//g, "</span>")
    : out;
}

/* disc e topic dizem de onde são as imagens; sem eles, vale o que está aberto
   no formulário (é o caso da prévia) */
function renderTeoria(texto, disc, topic) {
  const linhas = texto.split("\n");
  let html = "", lista = null;
  const fecha = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const abre = tipo => { if (lista !== tipo) { fecha(); html += `<${tipo}>`; lista = tipo; } };
  // espaços no começo da linha: em parágrafo viram recuo só da primeira linha
  // (o "espaço inicial"), em item de lista empurram o item inteiro
  const recuo = (l, prop = "margin-left") => {
    const n = Math.min(24, l.match(/^\s*/)[0].replace(/\t/g, RECUO).length);
    return n ? ` style="${prop}:${n * .5}em"` : "";
  };

  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i]; let m;
    // fórmula em bloco aberta numa linha e fechada em outra
    if (/^\s*\$\$/.test(l) && !/\$\$.*\$\$/.test(l)) {
      let j = i + 1;
      while (j < linhas.length && !linhas[j].includes("$$")) j++;
      if (j < linhas.length) {
        const corpo = [l.replace(/^\s*\$\$/, ""), ...linhas.slice(i + 1, j),
                       linhas[j].slice(0, linhas[j].indexOf("$$"))].join("\n").trim();
        fecha(); html += `<div class="p-tex">${tex(corpo, true)}</div>`;
        i = j; continue;
      }
    }
    if (!l.trim()) { fecha(); html += `<div class="p-vazio"></div>`; }
    else if (m = l.match(/^\s*(#{1,6})\s+(.*)$/)) {
      const h = Math.min(4, m[1].length + 1);
      fecha(); html += `<h${h}>${fmtInline(m[2])}</h${h}>`;
    }
    else if (m = l.match(/^\s*\[imagem:\s*([^\]\n]+?)\s*\]\s*$/)) {
      fecha(); html += `<img src="/image${esc(qsImg(m[1], disc, topic))}" alt="${esc(m[1])}" loading="lazy">`;
    }
    else if (/^\s*[─—_-]{3,}\s*$/.test(l)) { fecha(); html += "<hr>"; }
    else if (m = l.match(/^\s*[-•*]\s+(.*)$/)) { abre("ul"); html += `<li${recuo(l)}>${fmtInline(m[1])}</li>`; }
    else if (m = l.match(/^\s*(\d+)[.)]\s+(.*)$/)) {
      abre("ol"); html += `<li value="${m[1]}"${recuo(l)}>${fmtInline(m[2])}</li>`;
    }
    else if (m = l.match(/^\s*>\s?(.*)$/)) { fecha(); html += `<blockquote>${fmtInline(m[1]) || "&nbsp;"}</blockquote>`; }
    else { fecha(); html += `<p${recuo(l, "text-indent")}>${fmtInline(l)}</p>`; }
  }
  fecha();
  return html;
}

/* ------------------------------------- ferramentas do editor de teoria */

/* Usa execCommand em vez de mexer no .value: é a única forma de manter o
   Ctrl+Z nativo do textarea funcionando. Cai no .value se não houver suporte. */
function substituir(ta, texto) {
  // texto vazio é apagar a seleção: o insertText não faz isso em todo navegador
  const ok = texto ? document.execCommand("insertText", false, texto)
                   : ta.selectionStart === ta.selectionEnd || document.execCommand("delete");
  if (!ok) {
    const i = ta.selectionStart, f = ta.selectionEnd;
    ta.value = ta.value.slice(0, i) + texto + ta.value.slice(f);
    ta.selectionStart = ta.selectionEnd = i + texto.length;
  }
  contarTeoria(); marcarSujo();
}

function inserir(txt) {
  const ta = $("f-content");
  ta.focus();
  substituir(ta, txt);
}

/* Aplica a função a cada linha tocada pela seleção (ou à linha do cursor). */
function porLinha(fn) {
  const ta = $("f-content");
  ta.focus();
  const v = ta.value;
  const ini = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let fim = v.indexOf("\n", ta.selectionEnd);
  if (fim === -1) fim = v.length;
  const novo = v.slice(ini, fim).split("\n").map(fn).join("\n");
  ta.setSelectionRange(ini, fim);
  substituir(ta, novo);
  ta.setSelectionRange(ini, ini + novo.length);
}

/* Onde a seleção começa e termina (sem os espaços das pontas) e se ela já
   está envolvida na marca m. */
function marcaEm(m) {
  const ta = $("f-content");
  const v = ta.value, n = m.length;
  let i = ta.selectionStart, f = ta.selectionEnd;
  // espaço nas pontas fica de fora: "**palavra **" não é negrito
  while (i < f && /\s/.test(v[i])) i++;
  while (f > i && /\s/.test(v[f - 1])) f--;

  let dentro;
  if (m[0] === "*") {
    // conta os asteriscos colados na seleção: 2 é negrito, 1 itálico, 3 os dois
    let a = 0, b = 0;
    while (v[i - 1 - a] === "*") a++;
    while (v[f + b] === "*") b++;
    const k = Math.min(a, b);
    dentro = n === 2 ? k >= 2 : k % 2 === 1;
  } else dentro = i >= n && v.slice(i - n, i) === m && v.slice(f, f + n) === m;
  return { i, f, dentro };
}

/* Envolve a seleção na marca ("**", "*" ou "$"); se já estiver envolvida,
   tira. Sem seleção, deixa o cursor entre as duas marcas. */
function envolver(m) {
  const ta = $("f-content");
  ta.focus();
  const v = ta.value, n = m.length;
  const { i, f, dentro } = marcaEm(m);

  if (dentro) {
    ta.setSelectionRange(i - n, f + n);
    substituir(ta, v.slice(i, f));
    ta.setSelectionRange(i - n, f - n);
  } else {
    ta.setSelectionRange(i, f);
    substituir(ta, m + v.slice(i, f) + m);
    ta.setSelectionRange(i + n, f + n);
  }
}

const RE_MARCA = /^(\s*)(?:#{1,6}\s+|[-•*]\s+|\d+[.)]\s+|>\s?)/;

/* ------------------------------------------- teclado do editor de teoria */

const RECUO = "    ";
const RE_ITEM = /^\s*(?:[-•*]\s+|\d+[.)]\s+)/;

/* Recua (ou desfaz o recuo de) todas as linhas tocadas pela seleção. Com o
   cursor parado, ele continua no mesmo ponto do texto. */
function recuarLinhas(volta) {
  const ta = $("f-content");
  ta.focus();
  const v = ta.value, i = ta.selectionStart, f = ta.selectionEnd;
  const ini = v.lastIndexOf("\n", i - 1) + 1;
  let fim = v.indexOf("\n", f);
  if (fim === -1) fim = v.length;
  const linhas = v.slice(ini, fim).split("\n");
  const novas = linhas.map(l => volta ? l.replace(/^(?: {1,4}|\t)/, "") : (l.trim() ? RECUO + l : l));
  const novo = novas.join("\n");
  if (novo === v.slice(ini, fim)) return;
  ta.setSelectionRange(ini, fim);
  substituir(ta, novo);
  if (i === f) {
    const p = Math.max(ini, i + novas[0].length - linhas[0].length);
    ta.setSelectionRange(p, p);
  } else ta.setSelectionRange(ini, ini + novo.length);
}

/* Tab no meio de um parágrafo insere o espaço onde o cursor está — no começo
   da linha, é o recuo de parágrafo. Em item de lista, ou com várias linhas
   selecionadas, move as linhas inteiras. */
function tabular(volta) {
  const ta = $("f-content"), v = ta.value;
  const ini = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let fim = v.indexOf("\n", ta.selectionEnd);
  if (fim === -1) fim = v.length;
  const trecho = v.slice(ini, fim);
  if (!volta && !trecho.includes("\n") && !RE_ITEM.test(trecho)) return substituir(ta, RECUO);
  recuarLinhas(volta);
}

/* Enter repete o que a linha tinha no começo: o recuo, o marcador da lista
   (com o número seguinte) ou o ">" da citação. Num item vazio, sai da lista.
   Devolve false quando não há nada a repetir, e o Enter nativo segue. */
function continuarLinha() {
  const ta = $("f-content"), v = ta.value, i = ta.selectionStart;
  if (i !== ta.selectionEnd) return false;
  const ini = v.lastIndexOf("\n", i - 1) + 1;
  const antes = v.slice(ini, i);
  const [tudo, esp, bul, num, sep, cit] =
    antes.match(/^(\s*)(?:([-•*])\s+|(\d+)([.)])\s+|(>)\s?)?/);
  const marcador = bul || num || cit;
  if (!esp && !marcador) return false;
  const noFim = i === v.length || v[i] === "\n";
  if (marcador && noFim && !antes.slice(tudo.length).trim()) {
    ta.setSelectionRange(ini, i);
    substituir(ta, "");
    return true;
  }
  substituir(ta, "\n" + esp + (bul ? bul + " " : num ? `${+num + 1}${sep} ` : cit ? "> " : ""));
  return true;
}

/* Backspace dentro do recuo apaga um nível inteiro, não um espaço por vez. */
function apagarRecuo() {
  const ta = $("f-content"), v = ta.value, i = ta.selectionStart;
  if (i !== ta.selectionEnd) return false;
  const antes = v.slice(v.lastIndexOf("\n", i - 1) + 1, i);
  if (antes.length < 2 || /[^ ]/.test(antes)) return false;
  ta.setSelectionRange(i - ((antes.length - 1) % RECUO.length + 1), i);
  substituir(ta, "");
  return true;
}

/* Dois hífens seguidos viram travessão (—) na hora. Ficam como estão dentro
   de `código` e de $fórmula$, onde "--" é o que a pessoa quer mesmo. Backspace
   logo depois devolve os dois hífens; um terceiro hífen numa linha que só tem
   o travessão vira "---", o separador de seção. */
const trav = { pos: -1 };

function emCodigoOuFormula(v, i) {
  if ((v.slice(0, i).split("$$").length - 1) % 2) return true;      // bloco $$ aberto
  const linha = v.slice(v.lastIndexOf("\n", i - 1) + 1, i);
  let cod = false, form = false;
  for (let k = 0; k < linha.length; k++) {
    if (linha[k] === "`" && !form) cod = !cod;
    else if (linha[k] === "$" && !cod) {
      if (form) form = false;
      // mesma regra da prévia: "$" só abre fórmula colado no que vem depois
      else if (k + 1 < linha.length && !/\s/.test(linha[k + 1])) form = true;
    }
  }
  return cod || form;
}

function travessao() {
  const ta = $("f-content"), v = ta.value, i = ta.selectionStart;
  if (i !== ta.selectionEnd) return false;
  if (trav.pos === i && /^\s*—$/.test(v.slice(v.lastIndexOf("\n", i - 1) + 1, i))) {
    ta.setSelectionRange(i - 1, i);
    substituir(ta, "---");
    trav.pos = -1;
    return true;
  }
  if (v[i - 1] !== "-" || v[i - 2] === "-" || emCodigoOuFormula(v, i)) return false;
  ta.setSelectionRange(i - 1, i);
  substituir(ta, "—");
  trav.pos = i;
  return true;
}

function desfazerTravessao() {
  const ta = $("f-content"), i = ta.selectionStart;
  if (trav.pos !== i || i !== ta.selectionEnd || ta.value[i - 1] !== "—") return false;
  ta.setSelectionRange(i - 1, i);
  substituir(ta, "--");
  trav.pos = -1;
  return true;
}

/* com texto selecionado, digitar um destes envolve a seleção em vez de
   apagá-la: selecionar e apertar "*" duas vezes dá negrito */
const PARES = { "*":"*", "$":"$", "`":"`", "=":"=", "(":")", "[":"]", "{":"}", '"':'"' };

function alternar(re, prefixo) {
  porLinha(l => {
    if (!l.trim()) return l;
    if (re.test(l)) return l.replace(re, "$1");
    return l.replace(/^(\s*)/, "$1" + prefixo);
  });
}

const FERRAMENTAS = {
  negrito: () => envolver("**"),
  italico: () => envolver("*"),
  formula: () => envolver("$"),
  destaque: () => envolver("=="),
  codigo:  () => envolver("`"),
  citacao: () => alternar(/^(\s*)>\s?/, "> "),
  desrecuar: () => recuarLinhas(true),
  previa:  () => alternarPrevia(),
  titulo:  () => alternar(/^(\s*)#{1,6}\s+/, "## "),
  bullet:  () => alternar(/^(\s*)[-•*]\s+/, "- "),
  numero:  () => { let n = 0; porLinha(l => l.trim()
                     ? `${++n}. ${l.replace(RE_MARCA, "")}` : l); },
  recuar:  () => recuarLinhas(false),
  limpar:  () => porLinha(l => l.replace(RE_MARCA, "$1")),
  seta:    () => inserir(" → "),
  hifen:   () => inserir(" – "),
  regra:   () => inserir("\n────────────────────────\n"),
};

document.querySelector(".tt-bar").addEventListener("click", e => {
  const b = e.target.closest(".tt");
  if (b && FERRAMENTAS[b.dataset.tt]) FERRAMENTAS[b.dataset.tt]();
});

/* ------------------------------------------------ caixa sobre a seleção */

/* Mostra `el` colado ao texto selecionado em `o.alvo`. O editor diz onde a
   seleção está na tela (o.retangulos), o que já está aplicado (o.ativos) e
   como aplicar cada botão (o.aplicar); o resto — quando aparecer, onde ficar,
   quando sumir — é igual para a teoria e para o resumo. */
function criarBolha(el, o) {
  // fora: escondida só porque a seleção rolou para fora da área — volta sozinha
  let arrastando = false, quadro = 0, fora = false;

  function esconder() { el.hidden = true; fora = false; }

  function colocar(reusar) {
    if (arrastando) return;
    const rs = o.retangulos(reusar);
    if (!rs || !rs.length) return esconder();
    const a = o.alvo.getBoundingClientRect();
    const pri = rs.reduce((x, r) => r.top < x.top ? r : x);
    const ult = rs.reduce((x, r) => r.bottom > x.bottom ? r : x);
    if (ult.bottom < a.top || pri.top > a.bottom) { esconder(); fora = true; return; }
    fora = false;

    el.hidden = false;
    const on = o.ativos();
    for (const b of el.querySelectorAll("[data-tt]")) b.classList.toggle("on", !!on[b.dataset.tt]);

    // acima da primeira linha; sem espaço, abaixo da última; se a seleção
    // toma a área inteira, presa no topo dela
    const w = el.offsetWidth, h = el.offsetHeight, folga = 8;
    let ref = pri, top = pri.top - h - folga;
    if (top < a.top + 4) { ref = ult; top = ult.bottom + folga; }
    if (top + h > a.bottom - 4) { ref = pri; top = a.top + 4; }
    const meio = (Math.max(ref.left, a.left) + Math.min(ref.right, a.right)) / 2;
    const left = Math.max(a.left + 4, Math.min(meio - w / 2, a.right - w - 4));
    el.style.top = Math.round(top) + "px";
    el.style.left = Math.round(left) + "px";
  }

  const atualizar = () => colocar(false);

  // sem isto o clique tiraria o foco do editor e a seleção se perderia
  el.addEventListener("mousedown", e => e.preventDefault());
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-tt]");
    if (!b) return;
    o.aplicar(b.dataset.tt);
    atualizar();
  });

  // enquanto o mouse arrasta a caixa fica fora do caminho; aparece ao soltar
  o.alvo.addEventListener("mousedown", () => { arrastando = true; esconder(); });
  document.addEventListener("mouseup", () => {
    if (!arrastando) return;
    arrastando = false;
    setTimeout(atualizar, 0);      // clicar numa seleção só a desfaz depois do mouseup
  });
  o.alvo.addEventListener("keydown", e => { if (e.key === "Escape") esconder(); });
  o.alvo.addEventListener("keyup", e => { if (e.key !== "Escape") atualizar(); });
  o.alvo.addEventListener("input", atualizar);
  o.alvo.addEventListener("focus", atualizar);
  o.alvo.addEventListener("blur", esconder);
  o.alvo.addEventListener("scroll", () => {
    if ((el.hidden && !fora) || quadro) return;
    quadro = requestAnimationFrame(() => { quadro = 0; colocar(true); });
  });
  window.addEventListener("resize", () => { if (!el.hidden) atualizar(); });
}

/* Um textarea não diz onde o texto selecionado está na tela. O espelho é uma
   div invisível com a mesma largura, fonte e quebra de linha: o mesmo texto
   dentro dela cai nas mesmas posições, e lá dá para medir. */
const selTeoria = { espelho: null, linhas: null };

/* Mede várias faixas [início, fim) do texto de uma vez: para cada uma, os
   retângulos de cada linha que ela ocupa, relativos ao canto do conteúdo. */
function medirTrechos(ta, faixas) {
  let m = selTeoria.espelho;
  if (!m) {
    m = selTeoria.espelho = document.createElement("div");
    m.setAttribute("aria-hidden", "true");
    document.body.appendChild(m);
  }
  const cs = getComputedStyle(ta);
  m.style.cssText = "position:fixed; top:0; left:-99999px; visibility:hidden; pointer-events:none;"
    + " box-sizing:border-box; border:0; margin:0; white-space:pre-wrap; overflow-wrap:break-word;";
  for (const p of ["fontFamily", "fontSize", "fontWeight", "fontStyle", "fontVariant", "fontFeatureSettings",
                   "fontKerning", "lineHeight", "letterSpacing", "wordSpacing", "tabSize", "textIndent",
                   "textTransform", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft"])
    m.style[p] = cs[p];
  m.style.width = ta.clientWidth + "px";

  const v = ta.value, nos = [], trechos = [];
  let pos = 0;
  for (const [i, f] of faixas) {
    const t = document.createElement("span");
    t.textContent = v.slice(i, f);
    nos.push(v.slice(pos, i), t);
    trechos.push(t);
    pos = f;
  }
  nos.push(v.slice(pos) || " ");
  m.replaceChildren(...nos);
  const base = m.getBoundingClientRect();
  const saida = trechos.map(t => [...t.getClientRects()].filter(r => r.width > 0.5).map(r => ({
    top: r.top - base.top, bottom: r.bottom - base.top,
    left: r.left - base.left, right: r.right - base.left })));
  m.replaceChildren();
  return saida;
}

const medirSelecao = (ta, i, f) => medirTrechos(ta, [[i, f]])[0];

criarBolha($("bolha-teoria"), {
  alvo: $("f-content"),
  retangulos(reusar) {
    const ta = $("f-content");
    if (ta.readOnly || document.activeElement !== ta) return null;
    const i = ta.selectionStart, f = ta.selectionEnd;
    if (i === f || !ta.value.slice(i, f).trim()) return null;
    // na rolagem o texto não mudou: só desloca o que já foi medido
    if (!reusar || !selTeoria.linhas) selTeoria.linhas = medirSelecao(ta, i, f);
    const b = ta.getBoundingClientRect();
    const dx = b.left + ta.clientLeft - ta.scrollLeft, dy = b.top + ta.clientTop - ta.scrollTop;
    return selTeoria.linhas.map(r => ({
      top: r.top + dy, bottom: r.bottom + dy, left: r.left + dx, right: r.right + dx }));
  },
  ativos() {
    const ta = $("f-content"), v = ta.value;
    const linha = v.slice(v.lastIndexOf("\n", ta.selectionStart - 1) + 1).split("\n", 1)[0];
    return {
      negrito: marcaEm("**").dentro, italico: marcaEm("*").dentro, destaque: marcaEm("==").dentro,
      codigo: marcaEm("`").dentro, formula: marcaEm("$").dentro,
      titulo: /^\s*#{1,6}\s+/.test(linha), bullet: /^\s*[-•*]\s+/.test(linha),
      citacao: /^\s*>/.test(linha) };
  },
  aplicar(nome) { FERRAMENTAS[nome](); },
});

criarBolha($("bolha-resumo"), {
  alvo: quill.root,
  retangulos() {
    if (!quill.isEnabled() || !quill.hasFocus()) return null;
    const r = quill.getSelection();
    if (!r || !r.length || !quill.getText(r.index, r.length).trim()) return null;
    const s = window.getSelection();
    if (!s.rangeCount) return null;
    return [...s.getRangeAt(0).getClientRects()].filter(x => x.width > 0.5);
  },
  ativos() {
    const f = quill.getFormat();
    return { bold: f.bold, italic: f.italic, underline: f.underline, strike: f.strike,
             header: f.header === 2, bullet: f.list === "bullet", blockquote: f.blockquote };
  },
  aplicar(nome) {
    const f = quill.getFormat();
    if (nome === "header") quill.format("header", f.header === 2 ? false : 2, "user");
    else if (nome === "bullet") quill.format("list", f.list === "bullet" ? false : "bullet", "user");
    else quill.format(nome, !f[nome], "user");
  },
});

/* ------------------------------------------------------------- busca */

/* Procura em todas as teorias (no servidor, sem diferenciar maiúsculas nem
   acentos). Com texto no campo, os resultados tomam o lugar da árvore;
   apagar o campo, ou Esc, devolve a árvore. */
const busca = { id: 0, seq: 0 };

async function buscar() {
  const q = $("busca").value.trim(), seq = ++busca.seq;
  const res = $("busca-res"), normal = $("rail-normal");
  if (q.length < 2) { res.hidden = true; res.innerHTML = ""; normal.hidden = false; return; }
  salvarTeoria(); await auto.fila;                // o que acabou de ser digitado também é procurado
  let d = null;
  try { const r = await fetch("/search?q=" + encodeURIComponent(q)); if (r.ok) d = await r.json(); } catch (e) {}
  if (seq !== busca.seq) return;                  // já tem uma busca mais nova a caminho
  const rs = (d && d.results) || [];
  normal.hidden = true; res.hidden = false;
  res.innerHTML = `<div class="label">Resultados <span>${rs.length ? d.total || rs.length : 0}</span></div>` + (rs.length
    ? rs.map(r => `<div class="achado" data-d="${esc(r.discipline)}" data-t="${esc(r.topic)}">
        <div class="achado-d">${esc(r.discipline)}</div>
        <button class="topic" data-n="${r.count ? 0 : -1}" title="${esc(r.discipline)} / ${esc(r.topic)}">
          <span class="nome">${esc(r.topic)}</span>${r.count ? `<span class="n">${r.count}</span>` : ""}</button>
        ${r.hits.map(h => `<button class="trecho" data-n="${h.n}">${esc(h.before)}<mark>${esc(h.match)}</mark>${esc(h.after)}</button>`).join("")}
      </div>`).join("")
    : `<div class="fila-nada">nada encontrado</div>`);
}

/* Abre o tópico na teoria com a n-ésima ocorrência selecionada. A posição é
   reencontrada aqui, no texto que está no editor, com a mesma normalização do
   servidor — um número de caractere vindo de lá não sobreviveria a uma edição. */
async function abrirAchado(disc, topic, n) {
  const alvo = normalizar($("busca").value).texto.trim();
  selecionar(disc, topic);
  trocarAba("pane-theory");
  if (n < 0 || !alvo) return;
  const ta = $("f-content");
  for (let k = 0; k < 150 && (ta.readOnly || $("f-topic").value !== topic || $("f-disc").value !== disc); k++)
    await new Promise(r => setTimeout(r, 30));
  if (ta.readOnly) return;
  const H = normalizar(ta.value);
  let i = -1, de = 0;
  for (let k = 0; k <= n; k++) {
    i = H.texto.indexOf(alvo, de);
    if (i < 0) return;
    de = i + alvo.length;
  }
  const ini = H.mapa[i], fim = H.mapa[i + alvo.length - 1] + 1;
  ta.focus();
  ta.setSelectionRange(ini, fim);
  const linhas = medirSelecao(ta, ini, fim);
  if (linhas.length) ta.scrollTop = Math.max(0, linhas[0].top - ta.clientHeight / 3);
}

$("busca").addEventListener("input", () => { clearTimeout(busca.id); busca.id = setTimeout(buscar, 180); });
$("busca").addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  e.stopPropagation();
  $("busca").value = ""; buscar(); $("busca").blur();
});
$("busca-res").addEventListener("click", e => {
  const b = e.target.closest("[data-n]");
  if (!b) return;
  const a = b.closest(".achado");
  abrirAchado(a.dataset.d, a.dataset.t, +b.dataset.n);
});

/* ------------------------------------------------------- importação */

/* O par do exportar: um .zip com <disciplina>/<tópico>.txt (e as imagens).
   Tópico que já existe com outro texto não é trocado sem perguntar. */
async function importarZip(arq, sobrescrever = false, antes = 0) {
  salvarTeoria(); await auto.fila;
  toast("importando…");
  let d;
  try {
    const r = await fetch(`/import/zip?name=${encodeURIComponent(arq.name.replace(/\.zip$/i, ""))}`
        + `&overwrite=${sobrescrever ? 1 : 0}`,
      { method: "POST", headers: { "Content-Type": "application/zip" }, body: arq });
    d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(typeof d.detail === "string" ? d.detail : `Falha ao importar (HTTP ${r.status}).`);
  } catch (e) { return toast("Falha ao importar."); }

  const novos = antes + d.imported.length;
  if (d.conflicts.length && !sobrescrever) {
    await carregarArvore();
    const lista = d.conflicts.slice(0, 8).map(([a, b]) => `• ${a} / ${b}`).join("\n")
      + (d.conflicts.length > 8 ? `\n… e mais ${d.conflicts.length - 8}` : "");
    if (confirm(`${d.conflicts.length} tópico(s) do ZIP já existem aqui com outro texto:\n\n${lista}`
        + `\n\nSubstituir pelo texto do ZIP?`)) return importarZip(arq, true, novos);
  }
  await carregarArvore();
  // o tópico aberto foi trocado por baixo: o editor da teoria precisa do texto novo
  if (d.replaced.some(([a, b]) => a === state.disc && b === state.topic)
      && $("f-topic").value.trim() === state.topic) carregarTeoria();
  if (abaAtiva() === "pane-stats") carregarStats();
  const partes = [];
  if (novos) partes.push(`${novos} importado${novos === 1 ? "" : "s"}`);
  if (d.replaced.length) partes.push(`${d.replaced.length} substituído${d.replaced.length === 1 ? "" : "s"}`);
  if (d.conflicts.length) partes.push(`${d.conflicts.length} mantido${d.conflicts.length === 1 ? "" : "s"}`);
  toast(partes.join(", ") || "nada novo no ZIP");
}

$("imp-zip").addEventListener("change", e => {
  const arq = e.target.files[0];
  e.target.value = "";                            // escolher o mesmo arquivo de novo tem que disparar
  if (arq) importarZip(arq);
});
