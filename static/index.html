function abrirExportar(disc) {
  $("modal").innerHTML = `
    <div class="overlay" data-fechar="1"><div class="modal pequeno">
      <header>
        <h2>Exportar</h2>
        <span class="meta" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(disc)}</span>
        <span class="spacer"></span>
        <button class="icon-btn" data-fechar="1" title="Fechar">✕</button>
      </header>
      <div class="corpo duas" data-disc="${esc(disc)}">
        <button class="btn btn-outline" data-exportar="pdf" title="Um documento com todos os tópicos">PDF</button>
        <button class="btn btn-outline" data-exportar="zip" title="Os textos e as imagens">ZIP</button>
      </div>
    </div></div>`;
}

$("modal").addEventListener("click", e => {
  const b = e.target.closest("[data-exportar]");
  if (!b) return;
  const disc = b.closest("[data-disc]").dataset.disc;
  fecharModal();
  b.dataset.exportar === "pdf" ? exportarPDF(disc) : exportarZip(disc);
});

/* o que estiver sendo digitado entra na exportação: salva antes */
async function salvarAntesDeExportar() { salvarTeoria(); await auto.fila; }

async function exportarZip(disc) {
  await salvarAntesDeExportar();
  try {
    const r = await fetch("/export/zip?discipline=" + encodeURIComponent(disc));
    if (!r.ok) return toast(`Falha ao exportar (HTTP ${r.status}).`);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = disc + ".zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) { toast("Falha ao exportar."); }
}

/* O PDF é a própria prévia da teoria, tópico por tópico, entregue à impressão
   do navegador — é ele que sabe desenhar fórmula e imagem. */
async function exportarPDF(disc) {
  await salvarAntesDeExportar();
  const d = state.disciplinas.find(x => x.name === disc);
  if (!d || !d.topics.length) return toast("sem tópicos");
  toast("montando PDF…");
  const textos = await Promise.all(d.topics.map(t => textoDaTeoria(disc, t)));

  const alvo = $("impressao");
  alvo.classList.add("medindo");
  const indice = d.topics.length > 1 ? `
    <section class="imp-indice"><h1>${esc(disc)}</h1>
      <ol>${d.topics.map((t, i) => `<li><a href="#imp-${i}">${esc(t)}</a></li>`).join("")}</ol>
    </section>` : "";
  alvo.innerHTML = indice + d.topics.map((t, i) => `
    <section class="imp-topico" id="imp-${i}" data-d="${esc(disc)}" data-t="${esc(t)}">
      <div class="imp-disc">${esc(disc)}</div>
      <h1>${esc(t)}</h1>
      <div class="tt-prev">${textos[i].trim() ? renderTeoria(textos[i], disc, t)
                                              : `<p class="imp-vazio">sem texto</p>`}</div>
    </section>`).join("");

  // papel não tem mouse: a imagem ligada a um trecho sai como figura logo
  // depois do parágrafo dele, com o trecho de legenda
  for (const sec of alvo.querySelectorAll(".imp-topico")) {
    const fim = new Map();                        // bloco → última figura posta depois dele
    for (const l of sec.querySelectorAll(".lig")) {
      const b = l.closest("p, li, blockquote, h2, h3, h4") || l;
      for (const nome of nomesDaLista(l.dataset.imgs)) {
        const fig = document.createElement("figure");
        fig.className = "imp-fig";
        fig.innerHTML = `<img src="/image${esc(qsImg(nome, sec.dataset.d, sec.dataset.t))}" alt="">
          <figcaption>${esc(l.textContent)}</figcaption>`;
        if (b.tagName === "LI") b.appendChild(fig);
        else { (fim.get(b) || b).after(fig); fim.set(b, fig); }
      }
    }
  }

  // a impressão não espera imagem: todas carregadas antes; a que não existe
  // mais sai do documento em vez de virar um quadro quebrado
  await Promise.all([...alvo.querySelectorAll("img")].map(img => {
    img.loading = "eager";
    return img.decode().catch(() => (img.closest("figure") || img).remove());
  }));
  alvo.offsetHeight;                            // força o desenho: é ele que pede as fontes
  try { await document.fonts.ready; } catch (e) {}
  alvo.classList.remove("medindo");

  const titulo = document.title;
  document.title = disc;                        // vira o nome sugerido do arquivo
  document.body.classList.add("imprimindo");
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("imprimindo");
    document.title = titulo;
    alvo.innerHTML = "";
  }, { once: true });
  window.print();
}

/* ------------------------------------------- imagens coladas na teoria */

/* O textarea guarda texto e nada mais, então o Ctrl+V de um print é
   interceptado: o arquivo sobe para o disco e o texto recebe só o marcador
   "[imagem: x.png]". O backend tira esse marcador antes de mandar a teoria
   para o modelo — a imagem nunca entra no prompt. */

const TIPOS_IMG = ["image/png", "image/jpeg", "image/gif", "image/webp"];

function qsImg(nome, disc = $("f-disc").value.trim(), topic = $("f-topic").value.trim()) {
  const q = `?discipline=${encodeURIComponent(disc)}`
          + `&topic=${encodeURIComponent(topic)}`;
  return nome ? q + `&name=${encodeURIComponent(nome)}` : q;
}

/* Onde a imagem colada vai se ligar. Com texto selecionado, é a seleção; sem
   seleção, a linha do cursor. De cada linha entra só o texto: recuo, marcador
   de lista ou título e espaços das pontas ficam fora dos colchetes. Trecho
   que já tem imagem ganha mais uma na mesma ligação. Devolve a troca a fazer
   ({a, b, novo}), quantos trechos foram ligados (n) e quantos não puderam. */
function planoDeLigacao(v, ini, fim, nome) {
  const a = v.lastIndexOf("\n", ini - 1) + 1;
  let b = v.indexOf("\n", fim > ini ? fim - 1 : fim);
  if (b < 0) b = v.length;
  let pos = a, n = 0, ruins = 0;
  const linhas = v.slice(a, b).split("\n").map(l => {
    const l0 = pos;
    pos += l.length + 1;
    let s = ini === fim ? 0 : Math.max(ini, l0) - l0;
    let e = ini === fim ? l.length : Math.min(fim, l0 + l.length) - l0;
    s = Math.max(s, (l.match(RE_MARCA) || l.match(/^\s*/))[0].length);
    while (s < e && /\s/.test(l[s])) s++;
    while (e > s && /\s/.test(l[e - 1])) e--;
    if (s >= e) return l;
    for (const m of l.matchAll(RE_LIG)) {
      const mi = m.index, mf = mi + m[0].length;
      if (s >= mf || e <= mi) continue;
      const nomes = nomesDaLista(m[2]);
      if (!nomes.includes(nome)) nomes.push(nome);
      n++;
      return l.slice(0, mi) + `[${m[1]}](imagem:${nomes.join(",")})` + l.slice(mf);
    }
    const trecho = l.slice(s, e);
    // colchete quebraria a marcação; dentro de código ou fórmula ela viraria conteúdo
    if (/[\[\]]/.test(trecho) || emCodigoOuFormula(v, l0 + s)) { ruins++; return l; }
    n++;
    return l.slice(0, s) + `[${trecho}](imagem:${nome})` + l.slice(e);
  });
  return { a, b, novo: linhas.join("\n"), n, ruins };
}

/* O alvo é fotografado na hora do Ctrl+V: o envio demora, e até ele voltar a
   seleção pode ter mudado. */
function alvoDaImagem() {
  const ta = $("f-content");
  return { ini: ta.selectionStart, fim: ta.selectionEnd, v: ta.value };
}

async function enviarImagem(file, alvo = alvoDaImagem()) {
  if (!$("f-disc").value.trim() || !$("f-topic").value.trim())
    return toast("Preencha disciplina e tópico antes de colar uma imagem.");
  // imagem solta no meio do texto não entra mais: sem trecho a que ligar, nem sobe
  if (!planoDeLigacao(alvo.v, alvo.ini, alvo.fim, "x").n)
    return toast(alvo.ini !== alvo.fim
      ? "Esse trecho não aceita imagem: tem colchetes, código ou fórmula."
      : "Selecione um trecho (ou deixe o cursor numa linha com texto) para ligar a imagem.");
  toast("enviando imagem...");
  try {
    const r = await fetch("/image" + qsImg(), {
      method: "POST", headers: { "Content-Type": file.type }, body: file });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(d.detail || `Falha ao enviar (HTTP ${r.status}).`);
    const ligou = ligarImagem(d.name, alvo);
    await carregarImagens();
    toast(ligou ? "imagem ligada ao trecho" : "imagem salva sem trecho: selecione um e cole de novo");
  } catch (e) { toast("Falha ao enviar a imagem."); }
}

/* Liga a imagem ao trecho. Devolve false se não houver mais a que ligar (o
   texto foi apagado enquanto ela subia): a imagem fica só na tira de baixo. */
function ligarImagem(nome, alvo) {
  const ta = $("f-content");
  // o texto mudou enquanto a imagem subia: vale a seleção de agora
  const { ini, fim } = ta.value === alvo.v ? alvo : { ini: ta.selectionStart, fim: ta.selectionEnd };
  const p = planoDeLigacao(ta.value, ini, fim, nome);
  if (!p.n) return false;
  ta.focus();
  ta.setSelectionRange(p.a, p.b);
  substituir(ta, p.novo);
  return true;
}

async function carregarImagens() {
  const alvo = $("f-imgs");
  if (!$("f-disc").value.trim() || !$("f-topic").value.trim()) return alvo.innerHTML = "";
  let imgs = [];
  try {
    const r = await fetch("/images" + qsImg());
    if (r.ok) imgs = (await r.json()).images || [];
  } catch (e) { /* sem imagens é um estado válido, não vale um erro na tela */ }
  alvo.innerHTML = imgs.map(n => `<div class="thumb" data-ver="${esc(n)}" title="${esc(n)}">
      <img src="/image${esc(qsImg(n))}" alt="" loading="lazy">
      <button class="x" data-del="${esc(n)}" title="Remover">×</button>
    </div>`).join("");
}

/* Some com a referência junto com o arquivo: um marcador ou uma ligação
   apontando para nada só confunde na hora de reler a teoria. O trecho ligado
   continua no texto, sem os colchetes — ou com as outras imagens que tiver. */
function removerMarcador(nome) {
  const ta = $("f-content");
  const escapado = nome.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const novo = ta.value.replace(
    new RegExp(`\\n?[ \\t]*\\[imagem:\\s*${escapado}\\s*\\][ \\t]*`, "g"), "")
    .replace(RE_LIG, (tudo, dentro, lista) => {
      const nomes = nomesDaLista(lista);
      if (!nomes.includes(nome)) return tudo;
      const resto = nomes.filter(x => x !== nome);
      return resto.length ? `[${dentro}](imagem:${resto.join(",")})` : dentro;
    });
  if (novo === ta.value) return;
  ta.focus(); ta.select();
  substituir(ta, novo);
}

$("f-imgs").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const n = del.dataset.del;
    if (!confirm("Remover esta imagem?\n\nEla sai do texto junto; o trecho ligado a ela continua.")) return;
    const r = await fetch("/image" + qsImg(n), { method: "DELETE" });
    if (!r.ok) return toast(`Falha ao remover (HTTP ${r.status}).`);
    removerMarcador(n);
    await carregarImagens();
    toast("imagem removida");
    return;
  }
  const ver = e.target.closest("[data-ver]");
  if (ver) abrirImagem(ver.dataset.ver, $("f-disc").value.trim(), $("f-topic").value.trim());
});

$("f-content").addEventListener("paste", e => {
  const it = [...(e.clipboardData?.items || [])]
    .find(i => i.kind === "file" && TIPOS_IMG.includes(i.type));
  if (!it) return;                    // texto colado segue o caminho nativo
  e.preventDefault();
  enviarImagem(it.getAsFile());
});

$("f-content").addEventListener("dragover", e => {
  if ([...(e.dataTransfer?.items || [])].some(i => i.kind === "file")) e.preventDefault();
});

$("f-content").addEventListener("drop", e => {
  const f = [...(e.dataTransfer?.files || [])].find(f => TIPOS_IMG.includes(f.type));
  if (!f) return;
  e.preventDefault();
  enviarImagem(f);
});

/* ------------------------------------------- imagens ligadas a um trecho */

/* A janela que mostra a(s) imagem(ns) de um trecho. Abre perto dele, do lado
   que tiver mais espaço, e fica enquanto o mouse estiver no trecho ou nela —
   dá para ir até a imagem e clicar para ampliar. */
const pop = { entra: 0, sai: 0, ret: null, dono: null, realces: [] };

function colocarPop() {
  const el = $("lig-pop"), r = pop.ret, m = 8;
  if (el.hidden || !r) return;
  const abaixo = innerHeight - r.bottom - 2 * m, acima = r.top - 2 * m;
  const embaixo = abaixo >= 380 || abaixo >= acima;
  const sala = Math.max(140, embaixo ? abaixo : acima);
  el.style.maxHeight = sala + "px";
  el.style.setProperty("--alt", (sala - 14) + "px");
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.round(Math.max(m, Math.min((r.left + r.right) / 2 - w / 2, innerWidth - w - m))) + "px";
  el.style.top = Math.round(embaixo ? r.bottom + 6 : Math.max(m, r.top - 6 - h)) + "px";
}

function mostrarImagens(nomes, ret, disc, topic, dono) {
  clearTimeout(pop.sai);
  const el = $("lig-pop");
  if (pop.dono && pop.dono !== dono && pop.dono.classList) pop.dono.classList.remove("on");
  pop.ret = ret; pop.dono = dono;
  if (dono && dono.classList) dono.classList.add("on");
  el.innerHTML = nomes.map(n =>
    `<img src="/image${esc(qsImg(n, disc, topic))}" alt="" data-nome="${esc(n)}">`).join("");
  el.dataset.d = disc; el.dataset.t = topic;
  el.classList.toggle("varias", nomes.length > 1);
  // o tamanho só existe depois que a imagem chega; a que não existe mais sai
  for (const img of el.querySelectorAll("img")) {
    img.addEventListener("load", colocarPop);
    img.addEventListener("error", () => { img.remove(); if (!el.children.length) sumirImagens(); else colocarPop(); });
  }
  el.hidden = false;
  colocarPop();
}

function tirarRealce() {
  pop.realces.forEach(r => r.remove());
  pop.realces = [];
}

function sumirImagens() {
  clearTimeout(pop.entra); clearTimeout(pop.sai);
  if (pop.dono && pop.dono.classList) pop.dono.classList.remove("on");
  pop.dono = null; pop.ret = null;
  tirarRealce();
  ligTa.atual = -1;
  $("lig-pop").hidden = true;
}

function agendarSumir() {
  clearTimeout(pop.entra); clearTimeout(pop.sai);
  pop.sai = setTimeout(sumirImagens, 220);
}

function abrirImagem(nome, disc, topic) {
  sumirImagens();
  $("modal").innerHTML = `
    <div class="overlay" data-fechar="1"><div class="modal grande">
      <header><h2>Imagem</h2><span class="meta">${esc(nome)}</span><span class="spacer"></span>
        <button class="icon-btn" data-fechar="1" title="Fechar">✕</button></header>
      <div class="corpo lightbox"><img src="/image${esc(qsImg(nome, disc, topic))}" alt=""
        title="Clique para ver no tamanho real"></div>
    </div></div>`;
}

$("lig-pop").addEventListener("mouseenter", () => clearTimeout(pop.sai));
$("lig-pop").addEventListener("mouseleave", agendarSumir);
$("lig-pop").addEventListener("click", e => {
  const el = $("lig-pop"), img = e.target.closest("img") || el.querySelector("img");
  if (img) abrirImagem(img.dataset.nome, el.dataset.d, el.dataset.t);
});

/* Trecho com imagem em texto já desenhado: a prévia da teoria e os trechos
   "na teoria" do painel de análise. Na prévia as imagens são do tópico que
   está no formulário; fora dela, do tópico aberto. */
const origemDaLig = l => l.closest("#f-prev")
  ? [$("f-disc").value.trim(), $("f-topic").value.trim()] : [state.disc, state.topic];

document.addEventListener("mouseover", e => {
  const l = e.target.closest && e.target.closest(".lig");
  if (!l || l.closest("#impressao")) return;
  clearTimeout(pop.sai); clearTimeout(pop.entra);
  if (pop.dono === l) return;
  pop.entra = setTimeout(() => {
    if (!l.isConnected) return;
    const [d, t] = origemDaLig(l);
    mostrarImagens(nomesDaLista(l.dataset.imgs), l.getBoundingClientRect(), d, t, l);
  }, 120);
});
document.addEventListener("mouseout", e => {
  const l = e.target.closest && e.target.closest(".lig");
  if (l && !l.contains(e.relatedTarget)) agendarSumir();
});
// na captura: dentro do painel de análise o clique também marcaria o conceito
document.addEventListener("click", e => {
  const l = e.target.closest && e.target.closest(".lig");
  if (!l || l.closest("#impressao")) return;
  e.stopPropagation();
  const [d, t] = origemDaLig(l);
  abrirImagem(nomesDaLista(l.dataset.imgs)[0], d, t);
}, true);
window.addEventListener("resize", sumirImagens);
// rolar qualquer área tira o trecho de baixo da janela (rolar a própria janela, não)
document.addEventListener("scroll", e => {
  if (!$("lig-pop").hidden && e.target !== $("lig-pop")) sumirImagens();
}, true);

/* No texto cru o trecho é "[trecho](imagem:x.png)" dentro de um textarea, que
   não tem elementos para o mouse tocar. As posições saem do espelho (o mesmo
   da caixa de seleção), medidas uma vez por versão do texto; o destaque é uma
   faixa translúcida posta por cima. */
const ligTa = { v: null, w: 0, itens: [], quadro: 0, atual: -1 };

function ligacoesDoTexto(ta) {
  if (ligTa.v !== ta.value || ligTa.w !== ta.clientWidth) {
    ligTa.v = ta.value; ligTa.w = ta.clientWidth;
    const ms = [...ta.value.matchAll(RE_LIG)];
    const rs = ms.length ? medirTrechos(ta, ms.map(m => [m.index, m.index + m[0].length])) : [];
    ligTa.itens = ms.map((m, k) => ({ nomes: nomesDaLista(m[2]), rets: rs[k] }));
  }
  return ligTa.itens;
}

function sobreOTexto(x, y) {
  const ta = $("f-content");
  if (ta.readOnly) return;
  const itens = ligacoesDoTexto(ta);
  if (!itens.length) return;
  const b = ta.getBoundingClientRect();
  const dx = b.left + ta.clientLeft - ta.scrollLeft, dy = b.top + ta.clientTop - ta.scrollTop;
  const k = itens.findIndex(it => it.rets.some(r =>
    x - dx >= r.left && x - dx <= r.right && y - dy >= r.top && y - dy <= r.bottom));
  if (k === ligTa.atual) { if (k >= 0) clearTimeout(pop.sai); return; }
  ligTa.atual = k;
  if (k < 0) return agendarSumir();
  clearTimeout(pop.sai); clearTimeout(pop.entra);
  pop.entra = setTimeout(() => {
    if (ligTa.atual !== k) return;
    // só as linhas do trecho que estão à vista, cortadas na borda do editor
    const vis = itens[k].rets.map(r => ({
      left: r.left + dx, right: r.right + dx,
      top: Math.max(r.top + dy, b.top), bottom: Math.min(r.bottom + dy, b.bottom) }))
      .filter(r => r.bottom - r.top > 2);
    if (!vis.length) return;
    tirarRealce();
    for (const r of vis) {
      const f = document.createElement("div");
      f.className = "lig-realce";
      f.style.cssText = `left:${r.left - 1}px; top:${r.top - 1}px; width:${r.right - r.left + 2}px; height:${r.bottom - r.top + 2}px`;
      document.body.appendChild(f);
      pop.realces.push(f);
    }
    mostrarImagens(itens[k].nomes, {
      left: Math.min(...vis.map(r => r.left)), right: Math.max(...vis.map(r => r.right)),
      top: Math.min(...vis.map(r => r.top)), bottom: Math.max(...vis.map(r => r.bottom)),
    }, $("f-disc").value.trim(), $("f-topic").value.trim(), ligTa);
  }, 120);
}

$("f-content").addEventListener("mousemove", e => {
  if (e.buttons || ligTa.quadro) return;          // arrastando para selecionar: não atrapalha
  const x = e.clientX, y = e.clientY;
  ligTa.quadro = requestAnimationFrame(() => { ligTa.quadro = 0; sobreOTexto(x, y); });
});
$("f-content").addEventListener("mouseleave", () => { ligTa.atual = -1; agendarSumir(); });
$("f-content").addEventListener("mousedown", sumirImagens);
$("f-content").addEventListener("input", sumirImagens);

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => trocarAba(t.dataset.pane)));
$("f-content").addEventListener("input", () => { contarTeoria(); marcarSujo(); });
/* O Tab fica preso no texto para recuar; Esc seguido de Tab devolve o Tab ao
   navegador, para quem navega pelo teclado conseguir sair do campo. */
let soltaTab = false;
$("f-content").addEventListener("keydown", e => {
  if (e.isComposing) return;
  const ta = e.target;
  // desfazer o travessão só vale para a tecla seguinte à que o criou
  if (e.key !== "Backspace" && e.key !== "-") trav.pos = -1;
  if (e.key === "Escape") { soltaTab = true; return; }
  if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (soltaTab) { soltaTab = false; return; }
    e.preventDefault(); tabular(e.shiftKey);
    return;
  }
  if (!["Shift", "Control", "Alt", "Meta"].includes(e.key)) soltaTab = false;
  if (e.altKey) return;
  if (e.ctrlKey || e.metaKey) {
    const f = !e.shiftKey && { b: "negrito", i: "italico", m: "formula" }[e.key.toLowerCase()];
    if (f) { e.preventDefault(); FERRAMENTAS[f](); }
    return;
  }
  if (e.key === "Enter" && !e.shiftKey) { if (continuarLinha()) e.preventDefault(); }
  else if (e.key === "Backspace") { if (desfazerTravessao() || apagarRecuo()) e.preventDefault(); }
  else if (e.key === "-") { if (travessao()) e.preventDefault(); }
  else if (PARES[e.key] && ta.selectionStart !== ta.selectionEnd) {
    e.preventDefault();
    const i = ta.selectionStart, f = ta.selectionEnd;
    substituir(ta, e.key + ta.value.slice(i, f) + PARES[e.key]);
    ta.setSelectionRange(i + 1, f + 1);
  }
});
$("f-content").addEventListener("mousedown", () => { trav.pos = -1; });
/* a prévia acompanha a rolagem do texto, na mesma proporção */
$("f-content").addEventListener("scroll", () => {
  const ta = $("f-content"), pv = $("f-prev");
  const max = ta.scrollHeight - ta.clientHeight;
  if (max > 0) pv.scrollTop = ta.scrollTop / max * (pv.scrollHeight - pv.clientHeight);
});
(function () {
  let p = null;
  try { p = localStorage.getItem("ar-previa"); } catch (e) {}
  alternarPrevia(p !== "0", false);
})();
/* as imagens estão presas ao par disciplina+tópico; renomear qualquer um dos
   dois muda a pasta, então a tira é recarregada para mostrar o que existe lá */
$("f-disc").addEventListener("change", carregarImagens);
$("f-topic").addEventListener("change", carregarImagens);
/* nome confirmado (Enter ou saída do campo) salva na hora, como o botão
   Salvar fazia: com nome novo, a teoria é gravada como um tópico novo */
$("f-disc").addEventListener("change", salvarAgora);
$("f-topic").addEventListener("change", salvarAgora);
window.addEventListener("pagehide", () => { salvarTeoria(true); salvarRascunho(true); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { salvarTeoria(true); salvarRascunho(true); }
});

/* No resumo, a mesma regra do "--" → "—" da teoria. O editor é outro (Quill),
   então a troca acontece logo depois de o segundo hífen entrar. */
const Delta = Quill.import("delta");
const travQ = { pos: -1 };
const soInline = f => Object.fromEntries(
  ["bold", "italic", "underline", "strike"].filter(k => f[k]).map(k => [k, f[k]]));

function travessaoNoResumo(delta) {
  const ops = delta.ops || [], ult = ops[ops.length - 1];
  if (!ult || ult.insert !== "-" || ops.length > 2 || (ops.length === 2 && ops[0].retain == null)) return;
  const fim = (ops.length === 2 ? ops[0].retain : 0) + 1;         // logo depois do hífen digitado
  setTimeout(() => {
    if (fim < 2 || quill.getText(fim - 2, 2) !== "--" || (fim > 2 && quill.getText(fim - 3, 1) === "-")) return;
    const f = quill.getFormat(fim - 1, 1);
    if (f.code || f["code-block"]) return;
    quill.updateContents(new Delta().retain(fim - 2).delete(2).insert("—", soInline(f)), "user");
    quill.setSelection(fim - 1, 0, "silent");
    travQ.pos = fim - 1;
  }, 0);
}

// Backspace logo depois devolve os dois hífens; entra na frente do Backspace
// padrão do editor, que senão apagaria o travessão inteiro
quill.keyboard.addBinding({ key: 8 }, range => {
  if (range.length || range.index !== travQ.pos || quill.getText(range.index - 1, 1) !== "—") return true;
  const f = quill.getFormat(range.index - 1, 1);
  quill.updateContents(new Delta().retain(range.index - 1).delete(1).insert("--", soInline(f)), "user");
  quill.setSelection(range.index + 1, 0, "silent");
  travQ.pos = -1;
  return false;
});
quill.keyboard.bindings[8].unshift(quill.keyboard.bindings[8].pop());
quill.root.addEventListener("keydown", e => { if (e.key !== "Backspace" && e.key !== "-") travQ.pos = -1; });
quill.root.addEventListener("mousedown", () => { travQ.pos = -1; });

quill.on("text-change", (delta, antes, origem) => {
  if (origem === "user") { marcarRascunho(); travessaoNoResumo(delta); }
  if ($("review-wrap").hidden) contarPalavras();
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "s") {
    e.preventDefault();               // o "salvar página" do navegador não serve para nada aqui
    if (abaAtiva() === "pane-theory") salvarAgora();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault(); $("busca").focus(); $("busca").select();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); analisar(); }
});

(function () {
  let m = null;
  try { m = localStorage.getItem("ar-modo"); } catch (e) {}
  trocarModo(m || "livre", false);   // já chama vazio() / carregarRoteiro()
})();
carregarArvore();
</script>
