<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Active Recall</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout ancorado: lateral, cabeçalho, editor, rodapé e painel são áreas fixas
   separadas por linhas, como num editor de código. Nada flutua. Cor só para
   estado (ok/parcial/erro). */
:root {
  --bg:#0b0b0c; --panel:#111113; --raised:#1b1b1e;
  --border:#29292d; --border-soft:#1e1e21;
  --text:#ececef; --muted:#8f8f97; --dim:#62626a;
  --accent:#ececef; --on-accent:#0b0b0c;
  --ok:#3fb950; --warn:#d29922; --err:#f85149; --none:#6e7681;
  --ok-bg:rgba(63,185,80,.10); --warn-bg:rgba(210,153,34,.10);
  --err-bg:rgba(248,81,73,.10); --none-bg:rgba(110,118,129,.10);
  --mk-warn:rgba(210,153,34,.22); --mk-err:rgba(248,81,73,.22); --mk-ok:rgba(63,185,80,.13);
  --lig:rgba(88,166,255,.22); --lig-linha:#58a6ff;
  --radius:8px; --strip:48px; --pad:16px; --texto:28px;
  color-scheme:dark;
}
:root[data-theme="light"] {
  color-scheme:light;
  --bg:#ffffff; --panel:#f7f7f8; --raised:#ececef;
  --border:#dcdce1; --border-soft:#e9e9ed;
  --text:#18181b; --muted:#62626c; --dim:#96969f;
  --accent:#18181b; --on-accent:#ffffff;
  --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --none:#6e7781;
  --ok-bg:rgba(26,127,55,.08); --warn-bg:rgba(154,103,0,.08);
  --err-bg:rgba(207,34,46,.08); --none-bg:rgba(110,119,129,.08);
  --mk-warn:rgba(212,167,44,.34); --mk-err:rgba(255,129,130,.34); --mk-ok:rgba(74,194,107,.22);
  --lig:rgba(9,105,218,.14); --lig-linha:#0969da;
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
button:focus-visible, .termo:focus-visible { outline:1.5px solid var(--muted); outline-offset:1px; }
[hidden] { display:none !important; }   /* vence o display das classes abaixo */

/* ---------------------------------------------------------------- layout */
.shell { display:grid; grid-template-columns:232px minmax(0,1fr) 420px;
  grid-template-rows:minmax(0,1fr); height:100%; }
body.no-side .shell { grid-template-columns:232px minmax(0,1fr); }
body.no-side .side { display:none; }
.rail { display:flex; flex-direction:column; min-height:0; background:var(--panel);
  border-right:1px solid var(--border); }
.rail-body { flex:1; min-height:0; overflow-y:auto; padding:12px 8px; }
.rail-foot { padding:10px; border-top:1px solid var(--border); display:flex; gap:8px; }
.rail-foot .imp { width:34px; flex:none; padding:7px 0; }
/* busca: faixa própria no topo da lateral; com texto nela, os resultados
   tomam o lugar da árvore */
.rail-busca { flex:none; height:40px; display:flex; align-items:center; padding:0 var(--pad);
  border-bottom:1px solid var(--border); }
.rail-busca input { font-size:12.5px; }
.achado { margin-bottom:8px; }
.achado-d { font-size:10.5px; color:var(--dim); padding:0 8px; letter-spacing:.03em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.achado .topic { display:flex; gap:6px; color:var(--text); font-weight:500; }
.achado .topic .nome { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.achado .topic .n { flex:none; font-size:11px; color:var(--dim); font-weight:400; font-variant-numeric:tabular-nums; }
.trecho { display:block; width:100%; text-align:left; border:none; background:none; cursor:pointer;
  font:inherit; font-size:11.5px; line-height:1.45; color:var(--muted); padding:4px 8px 4px 10px;
  margin-left:8px; width:calc(100% - 8px); border-left:1px solid var(--border); overflow-wrap:anywhere; }
.trecho:hover { background:var(--raised); color:var(--text); }
.trecho mark { background:var(--mk-warn); color:var(--text); border-radius:2px; }
/* fila de revisão: os tópicos que a revisão espaçada marcou para hoje */
#fila:not(:empty) { margin-bottom:14px; }
.topic.fila-item { display:flex; align-items:center; gap:6px; }
.fila-item .nome { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.fila-item .badge { flex:none; font-size:11px; }
.fila-nada { font-size:12px; color:var(--dim); padding:0 8px; }
.main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.side { min-height:0; overflow-y:auto; background:var(--panel); border-left:1px solid var(--border); }
#painel { padding:var(--pad) var(--pad) 40px; }

/* a faixa: cabeçalho de cada área, sempre da mesma altura */
.strip { height:var(--strip); flex:none; display:flex; align-items:center; gap:12px;
  padding:0 var(--pad); background:var(--panel); border-bottom:1px solid var(--border); }
.brand { font-weight:600; font-size:13.5px; letter-spacing:-.01em; }
.spacer { flex:1; }
.icon-btn { width:28px; height:28px; border-radius:6px; border:none; flex:none;
  background:transparent; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
.icon-btn:hover { background:var(--raised); color:var(--text); }

.label { font-size:12px; font-weight:500; color:var(--dim); margin-bottom:8px;
  display:flex; justify-content:space-between; align-items:center; }
.rail .label { padding:0 8px; }

/* ------------------------------------------------------------------ tree */
.disc { margin-bottom:2px; }
.disc-head { display:flex; align-items:center; gap:6px; width:100%; padding:6px 8px; border:none;
  background:transparent; border-radius:6px; color:var(--text); font:inherit; font-size:13px;
  font-weight:500; cursor:pointer; text-align:left; min-width:0; }
.disc-head:hover { background:var(--raised); }
.disc-head .caret { color:var(--dim); font-size:9px; width:10px; flex:none; transition:transform .15s; }
/* o nome trunca em vez de quebrar em duas linhas: sem isto, nome longo vira
   item flex encolhido e o texto se parte no meio do rail */
.disc-head .nome { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.disc.closed .caret { transform:rotate(-90deg); }
.disc.closed .topics { display:none; }
.disc-head .n { flex:none; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
.topics { padding-left:8px; margin:1px 0 6px 12px; border-left:1px solid var(--border); }
.topic { display:block; width:100%; text-align:left; padding:5px 8px; border:none; background:transparent;
  border-radius:6px; color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topic:hover { background:var(--raised); color:var(--text); }
.topic.active { background:var(--raised); color:var(--text); font-weight:500; }
.btn-ghost { width:100%; padding:7px; border:1px solid var(--border); border-radius:7px;
  background:transparent; color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer; }
.btn-ghost:hover { background:var(--raised); color:var(--text); }

/* o × de apagar só aparece no hover da linha, para não poluir a árvore */
.item { position:relative; }
.item > button:first-child { padding-right:24px; }
.del { position:absolute; right:3px; top:50%; transform:translateY(-50%);
  border:none; background:none; color:var(--dim); cursor:pointer;
  font-size:15px; line-height:1; padding:1px 5px; border-radius:4px; opacity:0;
  transition:opacity .12s, color .12s, background .12s; }
.item:hover .del, .del:focus-visible { opacity:1; }
.del:hover { color:var(--err); background:var(--err-bg); }
/* exportar: mesmo lugar e mesmo comportamento do ×, um passo à esquerda */
.disc > .item > button:first-child { padding-right:46px; }
.del.exp { right:24px; font-size:12px; padding:3px 5px; }
.del.exp:hover { color:var(--text); background:var(--border); }

/* ------------------------------------------------------------------ main */
h1 { font-size:14px; font-weight:600; letter-spacing:-.01em; margin:0; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* abas e modos são o mesmo controle: um grupo com borda, o ativo preenchido */
.tabs, .seg { display:inline-flex; flex:none; gap:2px; padding:2px;
  border:1px solid var(--border); border-radius:8px; background:var(--bg); }
.tab, .modo { border:none; background:none; color:var(--muted); font:inherit; font-size:12.5px;
  padding:4px 11px; border-radius:6px; cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s; }
.tab:hover, .modo:hover { color:var(--text); }
.tab.active, .modo.active { background:var(--raised); color:var(--text); }
.pane { display:none; }
.pane.active { display:flex; flex-direction:column; flex:1; min-height:0; }

.card { background:none; border:none; }
/* rodapé da área: modo e contagem à esquerda, ação à direita */
.actions { flex:none; display:flex; align-items:center; gap:14px; height:52px;
  padding:0 var(--pad); background:var(--panel); border-top:1px solid var(--border); }
.modos { display:flex; align-items:center; }
.acao { display:flex; align-items:center; gap:10px; }
.counter { font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; margin-right:auto; }
.btn { border:none; border-radius:7px; cursor:pointer; font:inherit; font-size:13px; font-weight:500;
  padding:7px 16px; transition:opacity .15s, background .15s; }
.btn-primary { background:var(--accent); color:var(--on-accent); }
.btn-primary:hover:not(:disabled) { opacity:.85; }
.btn:disabled { opacity:.4; cursor:default; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:var(--raised); }
/* situação do salvamento automático; clicar salva na hora */
.situacao { border:none; background:none; padding:0; font:inherit; font-size:12.5px;
  color:var(--dim); cursor:pointer; }
.situacao:hover { color:var(--text); }
.situacao.warn { color:var(--warn); } .situacao.err { color:var(--err); }
.situacao:empty { display:none; }
.situacao.parada, .situacao.parada:hover { cursor:default; color:var(--dim); }
.situacao.parada.err { color:var(--err); }
/* modo refazer: toma o lugar do seletor Livre / Com dicas */
.refazendo { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text); }
/* texto de uma tentativa antiga, no histórico */
.tent-texto { font-size:14px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
.tent-conc { display:flex; align-items:baseline; gap:10px; padding:6px 0; font-size:12.5px;
  border-bottom:1px solid var(--border-soft); }
.tent-conc:last-child { border-bottom:none; }
.tent-conc .nome { flex:1; min-width:0; }

/* editor: barra de formatação em cima, texto ocupando o resto da área */
#edit-wrap { flex:1; min-height:0; display:flex; flex-direction:column; }
.ql-toolbar.ql-snow { flex:none; border:none !important; border-bottom:1px solid var(--border) !important;
  padding:7px 10px; background:var(--panel); }
.ql-container.ql-snow { flex:1; min-height:0; height:auto; display:flex; flex-direction:column;
  border:none !important; font-family:inherit; font-size:15px; }
/* o recuo da direita cresce em tela larga para a linha não passar de ~800px */
.ql-editor { flex:1; height:auto; min-height:220px; overflow-y:auto; line-height:1.75; color:var(--text);
  padding:22px max(var(--texto), calc(100% - 800px)) 22px var(--texto); }
.ql-editor.ql-blank::before { color:var(--dim); font-style:normal; left:var(--texto); right:var(--texto); }
.ql-snow .ql-stroke { stroke:var(--muted); }
.ql-snow .ql-fill { fill:var(--muted); }
.ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow.ql-toolbar button.ql-active .ql-stroke { stroke:var(--accent); }
.ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow.ql-toolbar button.ql-active .ql-fill { fill:var(--accent); }
/* o Quill assume tema claro: sem isto o seletor de título fica ilegível no escuro */
.ql-snow .ql-picker { color:var(--muted); }
.ql-snow .ql-picker-options { background:var(--raised); border-color:var(--border) !important; border-radius:7px; }
.ql-snow .ql-picker-item { color:var(--muted); }
.ql-snow .ql-picker-item:hover, .ql-snow .ql-picker-item.ql-selected { color:var(--accent); }
.ql-snow .ql-picker-label:hover, .ql-snow .ql-picker-label.ql-active { color:var(--accent); }
.ql-snow .ql-picker-label:hover .ql-stroke { stroke:var(--accent); }
.ql-toolbar.ql-snow .ql-formats { margin-right:10px; }
.ql-editor h2 { font-size:17px; font-weight:600; margin:14px 0 6px; }
.ql-editor h3 { font-size:15px; font-weight:600; margin:12px 0 5px; }
.ql-editor blockquote { border-left:2px solid var(--border); padding-left:12px; margin-left:0; color:var(--muted); }
.ql-editor pre.ql-syntax { background:var(--raised); color:var(--text); border-radius:6px; padding:10px 12px; }

/* -------------------------------------------------------------- revisão */
#review-wrap { flex:1; min-height:0; overflow-y:auto; }
.review { font-size:15px; line-height:1.9; white-space:pre-wrap;
  padding:22px max(var(--texto), calc(100% - 800px)) 22px var(--texto); }
/* sem padding horizontal: senão a marcação empurra a pontuação vizinha */
.mk { background:none; color:inherit; border-radius:3px; padding:2px 0; cursor:default;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  transition:background .15s, box-shadow .15s; }
.mk.warn { background:var(--mk-warn); box-shadow:inset 0 -2px 0 var(--warn); }
.mk.err  { background:var(--mk-err);  box-shadow:inset 0 -2px 0 var(--err); }
.mk.ok   { box-shadow:inset 0 -2px 0 var(--mk-ok); }
/* antes de .focus de propósito: mesma especificidade, então o hover ainda vence */
.mk.done { background:none; box-shadow:none; opacity:.4; }
.mk.focus { background:var(--accent); color:var(--on-accent); box-shadow:none; opacity:1; }
.review-note { font-size:12.5px; color:var(--dim); }

/* --------------------------------------------------------------- painel */
/* o painel tem um recuo só; o que é seção ou linha sangra até as bordas */
.score { margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 0; padding:var(--pad);
  border-bottom:1px solid var(--border); }
.score .big { display:flex; align-items:baseline; gap:6px; }
.score .big b { font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
.score .big span { font-size:12.5px; color:var(--muted); }
.bar { height:3px; background:var(--border); border-radius:999px; overflow:hidden; margin:10px 0 12px; }
.bar > i { display:block; height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .6s cubic-bezier(.4,0,.2,1); }
.tally { display:grid; grid-template-columns:1fr 1fr; gap:5px 24px; }
.tally div { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); }
.tally b { margin-left:auto; color:var(--text); font-weight:500; font-variant-numeric:tabular-nums; }
.dot { width:7px; height:7px; border-radius:50%; flex:none; }
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.dot.err{background:var(--err)} .dot.none{background:var(--none)}

#painel .label { margin:0 calc(-1 * var(--pad)); padding:9px var(--pad);
  border-bottom:1px solid var(--border); }
#painel .block .label { margin:0 0 8px; padding:0; border:none; }

/* cada conceito é uma linha de borda a borda; a faixa à esquerda dá o estado */
.detail { margin:0 calc(-1 * var(--pad)); padding:12px var(--pad) 12px calc(var(--pad) - 3px);
  border-left:3px solid var(--none); border-bottom:1px solid var(--border-soft);
  cursor:pointer; transition:background .15s, opacity .15s; }
.detail.ok{border-left-color:var(--ok)} .detail.warn{border-left-color:var(--warn)}
.detail.err{border-left-color:var(--err)} .detail.none{border-left-color:var(--none)}
.detail:hover, .detail.focus { background:var(--raised); }
.detail .top { display:flex; align-items:center; gap:9px; }
.detail .concept { font-size:13px; font-weight:500; flex:1; }

/* revisado: some de vista sem sair da lista */
.detail.done { opacity:.4; }
.detail.done .concept { text-decoration:line-through; text-decoration-thickness:1px; }
.tick { width:14px; height:14px; flex:none; border:1px solid var(--border); border-radius:4px;
  display:grid; place-items:center; transition:background .12s, border-color .12s; }
.tick::after { content:"✓"; font-size:9px; line-height:1; color:var(--on-accent); opacity:0; }
.detail:hover .tick { border-color:var(--muted); }
.detail.done .tick { background:var(--accent); border-color:var(--accent); }
.detail.done .tick::after { opacity:1; }
.linkbtn { background:none; border:none; padding:0; font:inherit; font-size:11.5px;
  color:var(--dim); cursor:pointer; }
.linkbtn:hover { color:var(--text); }
.progresso.tudo { color:var(--ok); }
.detail .why { font-size:12.5px; color:var(--muted); line-height:1.55; margin-top:5px; }
.detail .quote { font-size:12px; color:var(--dim); margin-top:7px; padding-left:9px;
  border-left:2px solid var(--border); font-style:italic; }
.tag { display:block; font-size:10.5px; color:var(--dim); margin-bottom:2px; font-style:normal; }
/* trecho da teoria: caixa própria, para não se confundir com o que você escreveu */
.ref { font-size:12px; color:var(--muted); line-height:1.6; margin-top:8px;
  padding:8px 10px; background:var(--bg); border:1px solid var(--border-soft);
  border-radius:6px; white-space:pre-wrap; }
.chip { font-size:11px; font-weight:500; white-space:nowrap; }
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)}
.chip.err{color:var(--err)} .chip.none{color:var(--none)}

.chips { display:flex; flex-wrap:wrap; gap:5px; }
.miss-chip { font-size:11.5px; color:var(--muted); border:1px solid var(--border);
  border-radius:999px; padding:2px 9px; }
.block { margin-top:var(--pad); }
.empty { font-size:12.5px; color:var(--dim); line-height:1.6; }
.err-box { border:1px solid var(--err); background:var(--err-bg); color:var(--err); border-radius:var(--radius);
  padding:11px 13px; font-size:12px; line-height:1.55; white-space:pre-wrap; }
.aviso { border:1px solid var(--warn); background:var(--warn-bg); color:var(--warn);
  border-radius:var(--radius); padding:11px 13px; font-size:12px; line-height:1.55; margin-bottom:var(--pad); }
.aviso b { color:inherit; }
.err-box b { display:block; margin-bottom:4px; }
.loading { height:2px; background:var(--border-soft); overflow:hidden;
  margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) var(--pad); }
.loading > i { display:block; height:100%; width:32%; background:var(--accent);
  animation:slide 1.1s ease-in-out infinite; }
@keyframes slide { 0%{transform:translateX(-110%)} 100%{transform:translateX(420%)} }
@media (prefers-reduced-motion:reduce) { .loading > i { animation:none; width:100%; opacity:.5; } }

/* ---------------------------------------------------------------- forms */
/* disciplina e tópico: duas células de uma mesma faixa, rótulo ao lado */
.row2 { flex:none; display:grid; grid-template-columns:1fr 1fr; border-bottom:1px solid var(--border); }
.field { display:flex; align-items:center; gap:10px; height:44px; padding:0 var(--pad); min-width:0; }
.field + .field { border-left:1px solid var(--border); }
.field:focus-within { box-shadow:inset 0 -1px 0 var(--text); }
.field > span { flex:none; font-size:12px; color:var(--dim); }
input[type=text], input[type=search], textarea { background:transparent; border:none; border-radius:0;
  color:var(--text); font:inherit; padding:0; width:100%; min-width:0; }
input:focus, textarea:focus { outline:none; }
::placeholder { color:var(--dim); }

/* barra de ferramentas da teoria: insere marcadores de TEXTO, não formatação
   rica — a teoria vai literal para o modelo e ancora o campo "reference" */
#pane-theory > .card { flex:1; min-height:0; display:flex; flex-direction:column; }
.tt-bar { flex:none; display:flex; align-items:center; gap:2px; padding:7px 10px;
  background:var(--panel); border-bottom:1px solid var(--border); }
.tt { min-width:27px; height:25px; border:none; background:none; border-radius:5px;
  color:var(--muted); font:inherit; font-size:12.5px; cursor:pointer;
  display:grid; place-items:center; transition:background .12s, color .12s; }
.tt:hover { background:var(--raised); color:var(--text); }
.tt-txt { min-width:0; padding:0 8px; font-size:11.5px; }
.tt-sep { width:1px; height:16px; background:var(--border); margin:0 6px; }
.tt .on-b { font-weight:700; }
.tt .on-i { font-style:italic; font-family:Georgia,"Times New Roman",serif; font-size:14px; }
.tt.on { background:var(--raised); color:var(--text); }
.tt .on-u { text-decoration:underline; text-underline-offset:2px; }
.tt .on-s { text-decoration:line-through; }

/* caixa que aparece sobre o texto selecionado, com as ferramentas de formato
   à mão; fixed para não ser cortada pela rolagem do editor */
.bolha { position:fixed; top:0; left:0; z-index:40; display:flex; align-items:center; gap:2px;
  padding:4px; background:var(--panel); border:1px solid var(--border); border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,.22); user-select:none; }
.bolha .tt-sep { margin:0 4px; }

/* texto à esquerda, prévia à direita: a teoria continua sendo texto puro com
   marcação (**negrito**, *itálico*, $fórmula$) e a prévia mostra o resultado */
.tt-split { flex:1; min-height:0; display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
.tt-split > textarea { min-height:220px; display:block; resize:none; line-height:1.7; font-size:14px;
  padding:20px var(--texto); tab-size:4; }
.tt-split.sem-previa { grid-template-columns:minmax(0,1fr); }
.tt-split.sem-previa > textarea { padding-right:max(var(--texto), calc(100% - 800px)); }
.tt-split.sem-previa > .tt-prev { display:none; }
.tt-prev { min-height:0; overflow-y:auto; padding:20px var(--texto); border-left:1px solid var(--border);
  font-size:14px; line-height:1.7; overflow-wrap:anywhere; }
.tt-prev p { margin:0; }
.tt-prev .p-vazio { height:.9em; }
.tt-prev h2, .tt-prev h3, .tt-prev h4 { margin:0 0 4px; font-weight:600; letter-spacing:-.01em; }
.tt-prev h2 { font-size:18px; } .tt-prev h3 { font-size:16px; } .tt-prev h4 { font-size:14px; }
.tt-prev ul, .tt-prev ol { margin:0; padding-left:1.5em; }
.tt-prev hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
.tt-prev img { display:block; max-width:100%; margin:6px 0; border:1px solid var(--border); border-radius:6px; }
.tt-prev .p-tex { margin:8px 0; overflow-x:auto; overflow-y:hidden; }
.tt-prev code, .ref code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em;
  background:var(--raised); border-radius:4px; padding:1px 5px; }
.tt-prev mark, .ref mark { background:var(--mk-warn); color:inherit; border-radius:3px; padding:0 2px; }
.tt-prev blockquote { margin:0; padding-left:12px; border-left:2px solid var(--border); color:var(--muted); }
.tt .on-m { background:var(--mk-warn); border-radius:3px; padding:0 4px; }
.katex { font-size:1.08em; }

/* Prints colados. Ficam fora do textarea, que só guarda texto: no meio da
   teoria entra apenas o marcador "[imagem: x.png]", removido antes de o
   texto ir para o modelo. */
.tt-imgs { flex:none; display:flex; flex-wrap:wrap; gap:8px; padding:10px var(--pad);
  border-top:1px solid var(--border); background:var(--panel); }
.tt-imgs:empty { display:none; }
.thumb { position:relative; width:88px; height:62px; border-radius:6px; overflow:hidden;
  border:1px solid var(--border); background:var(--bg); cursor:zoom-in; }
.thumb:hover { border-color:var(--muted); }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb .x { position:absolute; top:3px; right:3px; width:18px; height:18px; padding:0;
  border:none; border-radius:4px; background:rgba(0,0,0,.65); color:#fff;
  font-size:11px; line-height:1; cursor:pointer; opacity:0; transition:opacity .12s; }
.thumb:hover .x { opacity:1; }
.thumb .x:hover { background:var(--err); }
.lightbox { text-align:center; overflow:auto; }
.lightbox img { max-width:100%; max-height:80vh; border-radius:8px; cursor:zoom-in; }
.lightbox img.real { max-width:none; max-height:none; cursor:zoom-out; }
.modal.grande { width:min(1500px,100%); max-height:94vh; }

/* Imagem ligada a um trecho: o texto só ganha um pontilhado; a imagem abre
   numa janela ao passar o mouse e o trecho fica em destaque enquanto isso. */
.lig { border-bottom:1.5px dotted var(--lig-linha); border-radius:2px; cursor:zoom-in; transition:background .12s; }
.lig:hover, .lig.on { background:var(--lig); }
/* o mesmo destaque no texto cru, onde não há elemento para pintar */
.lig-realce { position:fixed; z-index:4; pointer-events:none; box-sizing:border-box;
  background:var(--lig); border-bottom:1.5px solid var(--lig-linha); border-radius:2px; }
#lig-pop { position:fixed; top:0; left:0; z-index:45; display:flex; flex-direction:column; gap:6px;
  padding:6px; overflow:auto; background:var(--panel); border:1px solid var(--border);
  border-radius:10px; box-shadow:0 12px 36px rgba(0,0,0,.4); cursor:zoom-in; }
#lig-pop img { display:block; flex:none; align-self:center; border-radius:6px;
  max-width:min(900px,78vw); max-height:min(var(--alt,70vh),74vh); }
/* mais de uma imagem no mesmo trecho: lado a lado, para caberem à vista */
#lig-pop.varias { flex-direction:row; flex-wrap:wrap; justify-content:center; max-width:min(1320px,94vw); }
#lig-pop.varias img { max-width:min(640px,45vw); max-height:min(var(--alt,60vh),62vh); }

/* -------------------------------------------------------------- roteiro */
.roteiro { display:flex; flex-direction:column; gap:var(--pad); }
/* mesma altura da faixa do cabeçalho: a linha de cima atravessa a tela */
.rt-topo { display:flex; align-items:center; gap:10px; height:var(--strip);
  margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 0; padding:0 var(--pad);
  border-bottom:1px solid var(--border); }
.rt-topo b { font-size:13px; font-weight:600; }
.rt-prog { font-size:11.5px; color:var(--dim); margin-left:auto; font-variant-numeric:tabular-nums; }
.rt-bloco > .t { font-size:12px; font-weight:500; color:var(--dim); margin-bottom:8px; }
.rt-lista { display:flex; flex-wrap:wrap; gap:6px; }
/* o termo é um alvo de clique: marcar conforme escreve é o gesto principal */
.termo { display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--bg); border:1px solid var(--border); border-radius:6px;
  padding:4px 9px; font-size:12px; color:var(--text); user-select:none;
  transition:opacity .14s, border-color .14s; }
.termo:hover { border-color:var(--muted); }
.termo .bx { width:12px; height:12px; border:1px solid var(--dim); border-radius:3px;
  flex:0 0 auto; display:grid; place-items:center; font-size:9px; line-height:1;
  color:transparent; }
.termo.feito { opacity:.42; }
.termo.feito .bx { background:var(--ok); border-color:var(--ok); color:#fff; }
.termo.feito .nm { text-decoration:line-through; }
.rt-aviso { font-size:12px; color:var(--warn); background:var(--warn-bg);
  border:1px solid var(--warn); border-radius:var(--radius); padding:9px 11px; line-height:1.5; }
.rt-aviso button { margin-top:7px; }
.modo-tag { font-size:10.5px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); color:var(--dim); }

/* --------------------------------------------------------- estatísticas */
/* Uma tabela só, de borda a borda: disciplina é a faixa, tópicos embaixo. */
#pane-stats { overflow-y:auto; }
#stats > .empty { padding:var(--pad); }
table { width:100%; border-collapse:separate; border-spacing:0; }
th { font-size:12px; font-weight:500; color:var(--dim); text-align:right;
  padding:10px var(--pad); background:var(--panel); border-bottom:1px solid var(--border); }
#stats th { position:sticky; top:0; z-index:1; }
th:first-child { text-align:left; }
td { padding:10px var(--pad); border-bottom:1px solid var(--border-soft); font-size:13px; text-align:right;
  font-variant-numeric:tabular-nums; }
td:first-child { text-align:left; font-variant-numeric:normal; }
tr.never td { color:var(--dim); }
.d-row td { background:var(--panel); border-bottom-color:var(--border); font-weight:500; cursor:pointer; }
.d-row:hover td { background:var(--raised); }
/* nada de display:flex num td: tira a célula do cálculo de colunas da tabela */
.d-row .caret { display:inline-block; width:14px; color:var(--dim); font-size:9px;
  transition:transform .15s; }
.d-row.closed .caret { transform:rotate(-90deg); }
.d-row .meta { font-size:11.5px; color:var(--dim); font-weight:400; margin-left:8px; }
.t-row td:first-child { padding-left:calc(var(--pad) + 26px); }
.t-row.hide { display:none; }
.t-row td { font-size:12.5px; }
.badge { font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)}
.badge.err{color:var(--err)} .badge.none{color:var(--dim); font-weight:400}
.tlink { background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:left; }
.tlink:hover { text-decoration:underline; text-underline-offset:3px; }
.spark { display:inline-flex; align-items:flex-end; gap:2px; height:18px; vertical-align:middle; }
.spark i { width:4px; min-height:2px; border-radius:1px; display:block; }
.spark i.ok{background:var(--ok)} .spark i.warn{background:var(--warn)} .spark i.err{background:var(--err)}
.delta { font-size:11px; margin-left:5px; }
.delta.up{color:var(--ok)} .delta.down{color:var(--err)}
.atraso-ok { color:var(--muted); }
.atraso-warn { color:var(--warn); }
.atraso-err { color:var(--err); }

/* ----------------------------------------------------------------- modal */
/* preso ao #modal: o KaTeX também usa a classe "overlay" (em \vec, por
   exemplo), e sem isto uma fórmula com vetor cobria a tela inteira */
#modal > .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60;
  display:grid; place-items:center; padding:28px; }
:root[data-theme="light"] #modal > .overlay { background:rgba(20,20,25,.3); }
.modal { background:var(--bg); border:1px solid var(--border); border-radius:10px; overflow:hidden;
  width:min(880px,100%); max-height:88vh; display:flex; flex-direction:column; }
.modal header { flex:none; display:flex; align-items:center; gap:12px; height:var(--strip);
  padding:0 var(--pad); background:var(--panel); border-bottom:1px solid var(--border); }
.modal header h2 { font-size:14px; font-weight:600; margin:0; }
.meta { font-size:12px; color:var(--dim); font-weight:400; }
.modal .corpo { overflow-y:auto; padding:var(--pad); }
.modal.pequeno { width:min(320px,100%); }
.modal .duas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modal .duas .btn { padding:10px; }
/* dentro do modal a tabela não encosta nas bordas, então ganha a própria */
.modal table { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.modal tr:last-child td { border-bottom:none; }
.hbtn { border:none; background:none; color:var(--dim); font:inherit; font-size:11.5px;
  cursor:pointer; padding:2px 0 2px 8px; }
.hbtn:hover { color:var(--text); }

.seq { display:inline-flex; gap:3px; align-items:center; }
.seq i { width:8px; height:8px; border-radius:2px; display:block; }
.seq i.ok{background:var(--ok)} .seq i.partial{background:var(--warn)}
.seq i.incorrect{background:var(--err)} .seq i.missing{background:var(--none)}
.conc-nome { font-weight:500; }
.conc-nota { font-size:11.5px; color:var(--dim); margin-top:3px; line-height:1.45; }
tr.limpo td { color:var(--dim); }
.legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-top:10px; }
.legenda span { display:flex; align-items:center; gap:6px; }

/* ---------------------------------------------------------------- PDF
   A disciplina é montada em #impressao e mandada para a impressão do
   navegador ("Salvar como PDF"). Fora da exportação o bloco não existe na
   tela, e a regra só vale com body.imprimindo: um Ctrl+P comum não muda. */
#impressao { display:none; }
/* enquanto monta: desenhado fora da tela, só para o navegador ir buscar as
   fontes das fórmulas antes de a impressão abrir */
#impressao.medindo { display:block; position:fixed; top:0; left:-99999px; width:176mm; visibility:hidden; }
@media print {
  @page { margin:18mm 17mm; }
  body.imprimindo, html:has(body.imprimindo) { height:auto; background:#fff; color-scheme:light; }
  body.imprimindo > *:not(#impressao) { display:none !important; }
  body.imprimindo #impressao {
    display:block; color:#16161a; font-size:11pt; line-height:1.6;
    print-color-adjust:exact; -webkit-print-color-adjust:exact;
    /* papel é sempre claro, qualquer que seja o tema da tela */
    --text:#16161a; --muted:#55555e; --dim:#85858e; --border:#d4d4da; --raised:#efeff2;
    --mk-warn:rgba(212,167,44,.38); }
  #impressao .imp-indice h1 { font-size:22pt; font-weight:600; letter-spacing:-.02em; margin:0 0 14pt; }
  #impressao .imp-indice ol { margin:0; padding-left:1.4em; }
  #impressao .imp-indice li { padding:2pt 0; }
  #impressao .imp-indice a { color:inherit; text-decoration:none; }
  #impressao .imp-topico { break-before:page; }
  #impressao .imp-topico:first-child { break-before:auto; }
  #impressao .imp-disc { font-size:9pt; color:var(--dim); letter-spacing:.04em; text-transform:uppercase; }
  #impressao .imp-topico > h1 { font-size:17pt; font-weight:600; letter-spacing:-.01em; margin:2pt 0 12pt;
    padding-bottom:8pt; border-bottom:1px solid var(--border); }
  #impressao .tt-prev { overflow:visible; padding:0; border:0; min-height:0; font-size:11pt; line-height:1.6; }
  #impressao .tt-prev h2 { font-size:14pt; } #impressao .tt-prev h3 { font-size:12.5pt; }
  #impressao .tt-prev h4 { font-size:11pt; }
  #impressao .tt-prev h2, #impressao .tt-prev h3, #impressao .tt-prev h4 { margin:8pt 0 3pt; break-after:avoid; }
  #impressao .tt-prev p { orphans:3; widows:3; }
  #impressao .tt-prev li, #impressao .tt-prev blockquote { break-inside:avoid; }
  #impressao .tt-prev img { max-height:230mm; object-fit:contain; break-inside:avoid; }
  #impressao .tt-prev .p-tex { overflow:visible; break-inside:avoid; }
  #impressao .imp-vazio { color:var(--dim); }
  #impressao .lig { background:none; border-bottom:1px dotted var(--dim); }
  #impressao .imp-fig { margin:8pt 0; break-inside:avoid; }
  #impressao .imp-fig img { display:block; max-width:100%; max-height:95mm; object-fit:contain;
    border:1px solid var(--border); border-radius:6px; }
  #impressao .imp-fig figcaption { font-size:9pt; color:var(--dim); margin-top:3pt; }
}

#toast { position:fixed; bottom:66px; right:16px; background:var(--text); color:var(--bg);
  border-radius:7px; padding:9px 14px; font-size:13px; opacity:0; transform:translateY(6px);
  pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; }
#toast.show { opacity:1; transform:translateY(0); }

@media (max-width:1280px) {
  .shell { grid-template-columns:208px minmax(0,1fr) 350px; }
  body.no-side .shell { grid-template-columns:208px minmax(0,1fr); }
}
/* sem largura para três colunas: o painel desce para baixo do editor e a
   página passa a rolar; a lateral e o editor continuam com a altura da tela */
@media (max-width:1040px) {
  html, body { height:auto; }
  .shell, body.no-side .shell { grid-template-columns:208px minmax(0,1fr);
    grid-template-rows:auto; height:auto; }
  .rail { position:sticky; top:0; height:100vh; grid-row:1 / span 2; }
  .main { height:100vh; }
  .side { grid-column:2; overflow:visible; border-left:none; border-top:1px solid var(--border); }
}
@media (max-width:760px) {
  .shell, body.no-side .shell { grid-template-columns:minmax(0,1fr); }
  .rail { position:static; height:auto; max-height:45vh; grid-row:auto;
    border-right:none; border-bottom:1px solid var(--border); }
  .main { height:auto; min-height:85vh; }
  .side { grid-column:1; }
  .row2 { grid-template-columns:1fr; }
  .field + .field { border-left:none; border-top:1px solid var(--border); }
  .tt-split { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1fr); }
  .tt-split.sem-previa { grid-template-rows:minmax(0,1fr); }
  .tt-prev { border-left:none; border-top:1px solid var(--border); }
  :root { --texto:18px; }
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="strip">
      <span class="brand">Active Recall</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-tema" title="Alternar tema" onclick="alternarTema()">◐</button>
    </div>
    <div class="rail-busca">
      <input type="search" id="busca" placeholder="Buscar" autocomplete="off" title="Buscar nas teorias (Ctrl+K)">
    </div>
    <div class="rail-body">
      <div id="busca-res" hidden></div>
      <div id="rail-normal">
        <div id="fila"></div>
        <div id="crumb" hidden></div>
        <div class="label">Disciplinas <span id="disc-count"></span></div>
        <div id="tree"></div>
      </div>
    </div>
    <div class="rail-foot">
      <button class="btn-ghost" onclick="novoTopico()">+ Novo tópico</button>
      <button class="btn-ghost imp" title="Importar ZIP" onclick="$('imp-zip').click()">↑</button>
      <input type="file" id="imp-zip" accept=".zip,application/zip" hidden>
    </div>
  </aside>

  <main class="main">
    <header class="strip">
      <h1 id="head-title">Nenhum tópico</h1>
      <div id="head-sub" hidden></div>
      <span class="spacer"></span>
      <div class="tabs">
        <button class="tab active" data-pane="pane-recall">Resumo</button>
        <button class="tab" data-pane="pane-theory">Teoria</button>
        <button class="tab" data-pane="pane-stats">Estatísticas</button>
      </div>
    </header>

    <section id="pane-recall" class="pane active">
      <div id="edit-wrap" class="card"><div id="editor"></div></div>
      <div id="review-wrap" hidden><div class="card review" id="review"></div></div>
      <div class="actions">
        <div class="modos" id="modos">
          <div class="seg">
            <button class="modo active" data-modo="livre">Livre</button>
            <button class="modo" data-modo="dicas">Com dicas</button>
          </div>
          <span id="modo-nota" hidden></span>
        </div>
        <div class="refazendo" id="refazendo" hidden>
          <span id="refazendo-n"></span>
          <button class="linkbtn" onclick="sairDoRefazer()" title="Voltar ao resumo completo">sair</button>
        </div>
        <span class="counter" id="counter">0 palavras</span>
        <span class="situacao parada" id="rasc-status"></span>
        <div class="acao" id="acao-editar">
          <button class="btn btn-primary" id="btn-analisar" title="Ctrl + Enter" onclick="analisar()">Analisar</button>
        </div>
        <div class="acao" id="acao-revisao" hidden>
          <button class="btn btn-outline" id="btn-refazer" onclick="iniciarRefazer()"
            title="Reescrever só os pontos que não saíram certos">Refazer erros</button>
          <button class="btn btn-outline" onclick="voltarAoEditor()">Editar texto</button>
        </div>
      </div>
    </section>

    <section id="pane-theory" class="pane">
      <div class="row2">
        <label class="field"><span>Disciplina</span>
          <input type="text" id="f-disc" list="discs" placeholder="Banco de Dados" autocomplete="off">
          <datalist id="discs"></datalist></label>
        <label class="field"><span>Tópico</span>
          <input type="text" id="f-topic" placeholder="Modelo Relacional" autocomplete="off"></label>
      </div>
      <div class="card">
        <div class="tt-bar">
          <button type="button" class="tt" data-tt="negrito" title="Negrito (Ctrl+B)"><span class="on-b">B</span></button>
          <button type="button" class="tt" data-tt="italico" title="Itálico (Ctrl+I)"><span class="on-i">I</span></button>
          <button type="button" class="tt" data-tt="destaque" title="Destaque (==texto==)"><span class="on-m">A</span></button>
          <button type="button" class="tt" data-tt="codigo" title="Código (`texto`)">&lt;/&gt;</button>
          <button type="button" class="tt" data-tt="formula" title="Fórmula em LaTeX (Ctrl+M)">∑</button>
          <span class="tt-sep"></span>
          <button type="button" class="tt" data-tt="titulo" title="Título de seção (##)">H</button>
          <button type="button" class="tt" data-tt="bullet" title="Lista com marcadores">•</button>
          <button type="button" class="tt" data-tt="numero" title="Lista numerada">1.</button>
          <button type="button" class="tt" data-tt="citacao" title="Citação (&gt;)">“</button>
          <span class="tt-sep"></span>
          <button type="button" class="tt" data-tt="seta" title="Inserir seta de definição">→</button>
          <button type="button" class="tt" data-tt="hifen" title="Inserir travessão">–</button>
          <button type="button" class="tt" data-tt="regra" title="Separador de seção">──</button>
          <span class="tt-sep"></span>
          <button type="button" class="tt" data-tt="desrecuar" title="Diminuir recuo (Shift+Tab)">«</button>
          <button type="button" class="tt" data-tt="recuar" title="Aumentar recuo (Tab)">»</button>
          <button type="button" class="tt tt-txt" data-tt="limpar" title="Remover marcadores da linha">limpar</button>
          <span class="spacer"></span>
          <button type="button" class="tt tt-txt" data-tt="previa" id="btn-previa" title="Mostrar ou esconder a prévia">prévia</button>
        </div>
        <div class="tt-split" id="f-split">
          <textarea id="f-content" placeholder="Cole a teoria: texto ou print."></textarea>
          <div class="tt-prev" id="f-prev"></div>
        </div>
        <div class="tt-imgs" id="f-imgs"></div>
      </div>
      <div class="actions">

<script>

                carregando:false, texto:"", teoria:"", itens:[], revisados:new Set(),
                // roteiro do modo "com dicas": o que veio do servidor e quais

                refazer:null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ------------------------------------------------------------------ tema */
function aplicarTema(t) {
  // dois temas: escuro e branco; qualquer outro valor guardado cai no branco
  if (t !== "dark") t = "light";
  document.documentElement.dataset.theme = t;
  $("btn-tema").textContent = t === "dark" ? "◐" : "◑";
  try { localStorage.setItem("ar-tema", t); } catch (e) {}
}
function alternarTema() {
  aplicarTema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}
(function () {
  let t = null;
  try { t = localStorage.getItem("ar-tema"); } catch (e) {}
  aplicarTema(t || "dark");
})();

const quill = new Quill("#editor", {
  theme: "snow",
  placeholder: "Escreva o que você lembra.",
  modules: { toolbar: [
    [{ header: [2, 3, false] }],
    ["bold", "italic", "underline", "strike"],
    [{ list: "ordered" }, { list: "bullet" }],
    [{ indent: "-1" }, { indent: "+1" }],
    ["blockquote", "code-block"],
    ["clean"]
  ] }
});

/* O modelo mistura inglês e português, e "not_remembered" contém "remembered":
   a ordem dos testes abaixo importa. */
function statusKey(s) {
  const t = String(s || "").toLowerCase();
  if (t.includes("incorrect") || t.includes("incorret") || t.includes("errad")) return "err";
  if (t.includes("partial") || t.includes("parcial")) return "warn";
  if (t.includes("not") || t.includes("não") || t.includes("nao")) return "none";
  if (t.includes("remember") || t.includes("lembr")) return "ok";
  return "none";
}
const ROTULO = { ok:"lembrado", warn:"parcial", err:"incorreto", none:"não lembrado" };
const faixa = v => v >= 70 ? "ok" : v >= 40 ? "warn" : "err";

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._id);
  toast._id = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ------------------------------------------------- casamento de trechos */

/* Normaliza para comparar (minúsculas, sem acento, espaços colapsados) e
   guarda o índice original de cada caractere, para reconstruir o intervalo. */
function normalizar(s) {
  const mapa = []; let out = ""; let espaco = true;
  for (let i = 0; i < s.length; i++) {
    const bruto = s[i];
    if (/\s/.test(bruto)) {
      if (!espaco) { out += " "; mapa.push(i); espaco = true; }
      continue;
    }
    const c = bruto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    if (!c) continue;
    out += c[0]; mapa.push(i); espaco = false;
  }
  return { texto: out, mapa };
}

/* O modelo raramente copia 100% literal. Tenta o trecho inteiro; falhando,
   procura a maior sequência de palavras dele que exista no texto. */
function localizar(hay, alvo) {
  if (!alvo || alvo.length < 4) return null;
  const i = hay.indexOf(alvo);
  if (i >= 0) return [i, alvo.length];
  const pal = alvo.split(" ").filter(Boolean);
  for (let n = pal.length - 1; n >= 3; n--) {
    for (let ini = 0; ini + n <= pal.length; ini++) {
      const t = pal.slice(ini, ini + n).join(" ");
      const j = hay.indexOf(t);
      if (j >= 0) return [j, t.length];
    }
  }
  return null;
}

function renderRevisao(texto, itens) {
  const H = normalizar(texto);
  const brutas = [];
  itens.forEach((it, idx) => {
    it._k = statusKey(it.status);
    it._marcado = false;
    if (it._k === "none") return;                       // não escreveu: nada a marcar
    const ev = (it.evidence || "").trim();
    if (!ev) { it._semTrecho = true; return; }
    const achado = localizar(H.texto, normalizar(ev).texto.trim());
    if (!achado) { it._semTrecho = true; return; }
    brutas.push({ ini:H.mapa[achado[0]], fim:H.mapa[achado[0]+achado[1]-1]+1, idx, k:it._k });
  });

  brutas.sort((a, b) => a.ini - b.ini || b.fim - a.fim);
  const marcas = []; let fimAnterior = 0;
  for (const m of brutas) {
    if (m.ini < fimAnterior) { itens[m.idx]._semTrecho = true; continue; }  // sobreposto
    marcas.push(m); fimAnterior = m.fim; itens[m.idx]._marcado = true;
  }

  let html = "", pos = 0;
  for (const m of marcas) {
    html += esc(texto.slice(pos, m.ini));
    html += `<mark class="mk ${m.k}" data-idx="${m.idx}">${esc(texto.slice(m.ini, m.fim))}</mark>`;
    pos = m.fim;
  }
  html += esc(texto.slice(pos));
  $("review").innerHTML = html;
  return marcas.length;
}

function focar(idx, on) {
  document.querySelectorAll('[data-idx="' + idx + '"]').forEach(el => {
    el.classList.toggle("focus", on);
    if (on) el.scrollIntoView({ block:"nearest" });
  });
}

/* -------------------------------------------------------------- árvore */

async function carregarArvore() {
  const r = await fetch("/disciplines");
  state.disciplinas = (await r.json()).disciplines || [];
  $("disc-count").textContent = state.disciplinas.length || "";
  $("discs").innerHTML = state.disciplinas.map(d => `<option value="${esc(d.name)}">`).join("");
  $("tree").innerHTML = state.disciplinas.length ? state.disciplinas.map(d => `
    <div class="disc${state.fechadas.has(d.name) ? " closed" : ""}" data-disc="${esc(d.name)}">
      <div class="item">
        <button class="disc-head" title="${esc(d.name)}"><span class="caret">▼</span><span class="nome">${esc(d.name)}</span><span class="n">${d.topics.length}</span></button>
        <button class="del exp" data-exp="1" title="Exportar">↓</button>
        <button class="del" data-del-disc="1" title="Apagar disciplina">×</button>
      </div>
      <div class="topics">${d.topics.map(t => `
        <div class="item">
          <button class="topic${d.name === state.disc && t === state.topic ? " active" : ""}" data-topic="${esc(t)}" title="${esc(t)}">${esc(t)}</button>
          <button class="del" data-del-topic="${esc(t)}" title="Apagar tópico">×</button>
        </div>`
      ).join("") || `<div style="font-size:12px;color:var(--dim);padding:5px 9px">sem tópicos</div>`}</div>
    </div>`).join("")
    : `<div class="empty" style="padding:4px 8px">Nenhuma disciplina.</div>`;
  if (!state.topic) {
    const d = state.disciplinas.find(x => x.topics.length);
    if (d) selecionar(d.name, d.topics[0]);

}

/* ------------------------------------------------------- revisar hoje */

/* A revisão espaçada é calculada no servidor (storage._agendar): aqui só
   entra a lista do que venceu. Sem nenhum tópico praticado, a área não existe. */
async function carregarFila() {
  let d = null;
  try { const r = await fetch("/review"); if (r.ok) d = await r.json(); } catch (e) {}
  const el = $("fila");
  if (!d || (!d.due.length && d.next == null)) { el.innerHTML = ""; return; }

    ? d.due.map(x => {

        return `<button class="topic fila-item" data-d="${esc(x.discipline)}" data-t="${esc(x.topic)}"
            title="${esc(x.discipline)} / ${esc(x.topic)}${atraso}">

      }).join("")
